name: Optimize host timeline playback

on:
  push:
    branches:
      - audit/rise-visual-command-re

permissions:
  contents: write

jobs:
  optimize:
    if: github.event.head_commit.message == 'Run host timeline playback optimization'
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/rise-visual-command-re
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply host timeline optimization
        run: python .github/scripts/optimize-host-timeline.py
      - name: Fix dense-body regression fixture
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/unit/test_qt_viewport.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '    from stepnx.core.profiles import MetadataScope\n',
              '    from stepnx.core.model import NoteCell, NoteRow\n'
              '    from stepnx.core.profiles import MetadataScope\n',
              1,
          )
          old = '''        rows = list(block.rows)\n        body_count = min(4, len(rows))\n        self.assertGreaterEqual(body_count, 2)\n        for index in range(body_count):\n            row = rows[index]\n            cells = list(row.cells)\n            cells[0] = replace(cells[0], raw=bytes((0x0B, 0x03, 0, 0)))\n            rows[index] = replace(row, cells=tuple(cells))\n        block = replace(block, rows=tuple(rows))\n        document = replace(document, splits=(replace(split, blocks=(block,)),))\n'''
          new = '''        rows = list(block.rows)\n        body_count = 2\n        self.assertGreaterEqual(len(rows), body_count)\n        next_id = document.next_stable_id\n        for index in range(body_count):\n            row = rows[index]\n            if hasattr(row, "cells"):\n                cells = list(row.cells)\n                cells[0] = replace(cells[0], raw=bytes((0x0B, 0x03, 0, 0)))\n            else:\n                cells = []\n                for lane in range(int(document.columns.value)):\n                    raw = bytes((0x0B, 0x03, 0, 0)) if lane == 0 else bytes(4)\n                    cells.append(NoteCell(next_id, raw, None))\n                    next_id += 1\n            rows[index] = NoteRow(row.stable_id, tuple(cells), None)\n        block = replace(block, rows=tuple(rows))\n        document = replace(\n            document,\n            splits=(replace(split, blocks=(block,)),),\n            next_stable_id=next_id,\n        )\n'''
          if old not in text:
              raise SystemExit('dense-body fixture fragment not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Install Linux Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libopengl0 libpulse0 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0
      - name: Install StepNX Studio with GUI dependencies
        run: python -m pip install -e '.[gui]'
      - name: Run complete repository suite
        run: python -m unittest discover -s tests -v
      - name: Commit verified host optimization
        run: |
          git config user.name 'OpenAI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/scripts/optimize-host-timeline.py
          git rm .github/workflows/optimize-host-timeline.yml
          git add src tests docs
          git diff --cached --check
          git commit -m 'Optimize dense playback host timeline'
          git push origin HEAD:audit/rise-visual-command-re
