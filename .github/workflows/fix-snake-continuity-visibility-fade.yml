name: Fix Snake continuity and visibility fade

on:
  push:
    branches:
      - audit/rise-visual-command-re

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Install Snake continuity and fade correction'
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/rise-visual-command-re
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply capture-driven visual corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected fragment not found in {path}: {old[:180]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Snake Path: phase zero must be the authored lane. The previous
          # implementation randomized all nine keyframes, which made the path
          # jump from random frame 0 to the straight lane at Div 222. Native
          # capture shows a continuous convergence, so keyframe 0 is identity
          # and only frames 1..8 are generated permutations.
          replace_once(
              'src/stepnx/preview/visuals.py',
              '''    state = int(seed) & 0xFFFFFFFF\n    frames: list[tuple[int, ...]] = []\n    for _ in range(PRIME2_ZIGZAG_KEYFRAME_COUNT):\n        candidates = list(range(count))\n        output = [0] * count\n''',
              '''    state = int(seed) & 0xFFFFFFFF\n    # Phase zero is the authored lane map. This is what makes the final\n    # 221/222 segment converge into the receptor lane instead of snapping at\n    # the Div 222 straight-zone boundary. The remaining eight maps are the\n    # recovered pseudo-random permutation sequence.\n    frames: list[tuple[int, ...]] = [tuple(range(count))]\n    for _ in range(1, PRIME2_ZIGZAG_KEYFRAME_COUNT):\n        candidates = list(range(count))\n        output = [0] * count\n''',
          )
          replace_once(
              'src/stepnx/preview/visuals.py',
              '''    """Build Prime 1's nine deterministic ZigZag permutation keyframes.\n\n    The native seed also includes an engine-owned per-player contribution that\n''',
              '''    """Build the nine deterministic legacy Snake Path keyframes.\n\n    Keyframe zero is the identity map, so phase zero joins the authored lane\n    continuously at Div 222. Keyframes one through eight use the recovered\n    permutation generator. The native seed also includes an engine-owned\n    per-player contribution that\n''',
          )

          # Restore the continuous Appear/Vanish alpha ramps. The midpoint hard
          # gate was a bad interpretation: it preserved which half is affected
          # but destroyed the visible fade demonstrated by the reference capture.
          replace_once(
              'src/stepnx/preview/commands.py',
              '''    def note_opacity(\n        self,\n        visibility: int,\n        *,\n        screen_y: float,\n        screen_midline: float,\n        time_ms: float,\n    ) -> float:\n        """Render legacy display modes around the physical screen midline.\n\n        Vanish is visible on the approach half and disappears after crossing the\n        centre line. Appear is the inverse. Header Visibility has already\n        rewritten the event's low VisualEffect bits before this function runs.\n        """\n\n        if self.nonstep or visibility == 0 or (self.vanish and self.appear):\n            return 0.0\n        below_midline = float(screen_y) >= float(screen_midline)\n        if visibility == 1:  # Appear: visible only after crossing centre.\n            opacity = 0.0 if below_midline else 1.0\n        elif visibility == 2:  # Vanish: visible only before crossing centre.\n            opacity = 1.0 if below_midline else 0.0\n        else:\n            opacity = 1.0\n        if self.appear:\n            opacity = min(opacity, 0.0 if below_midline else 1.0)\n        if self.vanish:\n            opacity = min(opacity, 1.0 if below_midline else 0.0)\n        if self.flash and int(float(time_ms) // 100.0) % 2:\n            opacity = 0.0\n        return opacity\n''',
              '''    def note_opacity(\n        self,\n        visibility: int,\n        *,\n        distance: float,\n        fade_distance: float,\n        time_ms: float,\n    ) -> float:\n        """Render serialized/COMMAND Appear and Vanish as continuous fades.\n\n        Header Visibility has already rewritten the event's low VisualEffect\n        bits before this function runs. Distance is measured from the displayed\n        receptor after field transforms: Appear ramps from transparent to opaque\n        while approaching it; Vanish performs the inverse ramp.\n        """\n\n        if self.nonstep or visibility == 0 or (self.vanish and self.appear):\n            return 0.0\n        span = max(1.0, float(fade_distance))\n        normalized = max(0.0, float(distance)) / span\n        if visibility == 1:  # Appear\n            opacity = 1.0 - normalized\n        elif visibility == 2:  # Vanish\n            opacity = normalized\n        else:\n            opacity = 1.0\n        if self.appear:\n            opacity = min(opacity, 1.0 - normalized)\n        if self.vanish:\n            opacity = min(opacity, normalized)\n        if self.flash and int(float(time_ms) // 100.0) % 2:\n            opacity = 0.0\n        return min(1.0, max(0.0, opacity))\n''',
          )

          # Measure fade from the actually rendered note to the actually
          # transformed receptor. This keeps the restored ramp correct under
          # Drop/Under Attack/Mid instead of regressing to untransformed Y.
          replace_once(
              'src/stepnx/gui/preview_widget.py',
              '''    def _event_opacity(self, event: PreviewEvent) -> float:\n        _, local_y, _ = self._event_render_geometry(event)\n        _, sy, _, ty = self._sequence_affine()\n        screen_y = sy * local_y + ty\n        return self.command.note_opacity(\n            int(event.visibility),\n            screen_y=screen_y,\n            screen_midline=float(self.height()) / 2.0,\n            time_ms=self._chart_time_ms,\n        )\n''',
              '''    def _event_opacity(self, event: PreviewEvent) -> float:\n        _, local_y, _ = self._event_render_geometry(event)\n        _, sy, _, ty = self._sequence_affine()\n        screen_y = sy * local_y + ty\n        receptor_y = sy * self._receptor_y() + ty\n        return self.command.note_opacity(\n            int(event.visibility),\n            distance=abs(screen_y - receptor_y),\n            fade_distance=max(1.0, float(self.height()) * 0.42),\n            time_ms=self._chart_time_ms,\n        )\n''',
          )

          # Regression tests: phase zero is identity/continuous and fade has
          # intermediate alpha values rather than a binary midpoint switch.
          replace_once(
              'tests/unit/test_rise_visual_modifiers.py',
              '''        lane = 2\n        self.assertEqual(\n            prime2_snake_path_lane_position(lane, 1.0, 5, 123, start=1.0, interval=2.0),\n            float(lane),\n        )\n        halfway = prime2_snake_path_lane_position(\n''',
              '''        lane = 2\n        self.assertEqual(frames[0], tuple(range(5)))\n        at_boundary = prime2_snake_path_lane_position(\n            lane, 1.0, 5, 123, start=1.0, interval=2.0\n        )\n        just_above = prime2_snake_path_lane_position(\n            lane, 1.000001, 5, 123, start=1.0, interval=2.0\n        )\n        self.assertEqual(at_boundary, float(lane))\n        self.assertAlmostEqual(just_above, float(lane), places=5)\n        halfway = prime2_snake_path_lane_position(\n''',
          )
          replace_once(
              'tests/unit/test_rise_visual_modifiers.py',
              '''    def test_legacy_vanish_and_appear_switch_at_screen_midline(self) -> None:\n        vanish = parse_gameplay_command("v")\n        appear = parse_gameplay_command("p")\n        for y, vanish_expected, appear_expected in (\n            (300.0, 1.0, 0.0),\n            (239.0, 0.0, 1.0),\n        ):\n            self.assertEqual(\n                vanish.note_opacity(\n                    3, screen_y=y, screen_midline=240.0, time_ms=0.0\n                ),\n                vanish_expected,\n            )\n            self.assertEqual(\n                appear.note_opacity(\n                    3, screen_y=y, screen_midline=240.0, time_ms=0.0\n                ),\n                appear_expected,\n            )\n''',
              '''    def test_legacy_vanish_and_appear_keep_continuous_fade(self) -> None:\n        vanish = parse_gameplay_command("v")\n        appear = parse_gameplay_command("p")\n        for distance, vanish_expected, appear_expected in (\n            (200.0, 1.0, 0.0),\n            (100.0, 0.5, 0.5),\n            (50.0, 0.25, 0.75),\n            (0.0, 0.0, 1.0),\n        ):\n            self.assertAlmostEqual(\n                vanish.note_opacity(\n                    3, distance=distance, fade_distance=200.0, time_ms=0.0\n                ),\n                vanish_expected,\n            )\n            self.assertAlmostEqual(\n                appear.note_opacity(\n                    3, distance=distance, fade_distance=200.0, time_ms=0.0\n                ),\n                appear_expected,\n            )\n''',
          )

          replace_once(
              'tests/unit/test_preview.py',
              '''    def test_chart_visibility_composes_with_nonstep_vanish_and_flash(self) -> None:\n        plain = parse_gameplay_command("")\n        self.assertEqual(\n            plain.note_opacity(\n                0, screen_y=300, screen_midline=240, time_ms=0\n            ),\n            0,\n        )\n        self.assertEqual(\n            plain.note_opacity(\n                1, screen_y=300, screen_midline=240, time_ms=0\n            ),\n            0,\n        )\n        self.assertEqual(\n            plain.note_opacity(\n                1, screen_y=200, screen_midline=240, time_ms=0\n            ),\n            1,\n        )\n        self.assertEqual(\n            plain.note_opacity(\n                2, screen_y=300, screen_midline=240, time_ms=0\n            ),\n            1,\n        )\n        self.assertEqual(\n            plain.note_opacity(\n                2, screen_y=200, screen_midline=240, time_ms=0\n            ),\n            0,\n        )\n        self.assertEqual(\n            parse_gameplay_command("n").note_opacity(\n                3, screen_y=300, screen_midline=240, time_ms=0\n            ),\n            0,\n        )\n        flashing = parse_gameplay_command("w")\n        self.assertEqual(\n            flashing.note_opacity(\n                3, screen_y=300, screen_midline=240, time_ms=50\n            ),\n            1,\n        )\n        self.assertEqual(\n            flashing.note_opacity(\n                3, screen_y=300, screen_midline=240, time_ms=150\n            ),\n            0,\n        )\n''',
              '''    def test_chart_visibility_composes_with_nonstep_vanish_and_flash(self) -> None:\n        plain = parse_gameplay_command("")\n        self.assertEqual(\n            plain.note_opacity(\n                0, distance=100, fade_distance=200, time_ms=0\n            ),\n            0,\n        )\n        self.assertEqual(\n            plain.note_opacity(\n                1, distance=50, fade_distance=200, time_ms=0\n            ),\n            0.75,\n        )\n        self.assertEqual(\n            plain.note_opacity(\n                2, distance=50, fade_distance=200, time_ms=0\n            ),\n            0.25,\n        )\n        self.assertEqual(\n            parse_gameplay_command("n").note_opacity(\n                3, distance=100, fade_distance=200, time_ms=0\n            ),\n            0,\n        )\n        flashing = parse_gameplay_command("w")\n        self.assertEqual(\n            flashing.note_opacity(\n                3, distance=100, fade_distance=200, time_ms=50\n            ),\n            1,\n        )\n        self.assertEqual(\n            flashing.note_opacity(\n                3, distance=100, fade_distance=200, time_ms=150\n            ),\n            0,\n        )\n''',
          )

          # The handoff must not preserve the now-disproven midpoint-gate claim.
          replace_once(
              'docs/RISE_RUNTIME_PARITY_HANDOFF.md',
              '''High bits, including `Effects.bZigZag = 0x10`, are preserved. StepNX performs the rewrite only on runtime event bytes, never on the canonical NX document. Appear/Vanish fade curves remain Animator/asset dependent, so the presentation is not claimed pixel-perfect.\n''',
              '''High bits, including `Effects.bZigZag = 0x10`, are preserved. StepNX performs the rewrite only on runtime event bytes, never on the canonical NX document. Legacy gameplay capture confirms that Appear/Vanish are continuous alpha fades rather than binary midpoint gates; StepNX restores the distance ramp while still treating the exact engine material/Animator curve as an approximation.\n''',
          )
          PY
      - name: Install Linux Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libopengl0 \
            libpulse0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-xinerama0
      - name: Install StepNX Studio with GUI dependencies
        run: python -m pip install -e '.[gui]'
      - name: Run complete repository suite
        run: python -m unittest discover -s tests -v
      - name: Commit verified corrections
        run: |
          git config user.name 'OpenAI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-snake-continuity-visibility-fade.yml
          git add src/stepnx/preview/visuals.py \
                  src/stepnx/preview/commands.py \
                  src/stepnx/gui/preview_widget.py \
                  tests/unit/test_rise_visual_modifiers.py \
                  tests/unit/test_preview.py \
                  docs/RISE_RUNTIME_PARITY_HANDOFF.md
          git diff --cached --check
          git commit -m 'Smooth Snake Path and restore visibility fades'
          git push origin HEAD:audit/rise-visual-command-re
