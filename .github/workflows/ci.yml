name: StepNX Studio CI

on:
  pull_request:
  push:
    branches:
      - main
      - hardening-0.9.5-editor-ux-cleanup

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui]"

      - name: Run strict Windows gate
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python tools/run_windows_test_gate.py

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run full suite on glibc 2.31 baseline
        run: |
          docker run --rm \
            -e DEBIAN_FRONTEND=noninteractive \
            -e QT_QPA_PLATFORM=offscreen \
            -v "$PWD:/work" \
            -w /work \
            python:3.11-bullseye \
            bash -lc '
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends \
                libasound2 \
                libegl1 \
                libgl1 \
                libpulse0 \
                libxcb-cursor0 \
                libxcb-icccm4 \
                libxcb-image0 \
                libxcb-keysyms1 \
                libxcb-render-util0 \
                libxcb-xinerama0 \
                libxkbcommon-x11-0
              python -m pip install --upgrade pip
              python -m pip install -e ".[gui]"
              python -m unittest discover -s tests -v
            '
