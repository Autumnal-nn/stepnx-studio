name: Fix Snake continuity and visibility fade v3

on:
  push:
    branches:
      - audit/rise-visual-command-re

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Install Snake continuity and fade correction v3'
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/rise-visual-command-re
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply corrected capture-driven visual patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/fix-snake-continuity-visibility-fade-v2.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = textwrap.dedent(workflow[start:end])
          script = script.replace(
              "updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)",
              "updated, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=re.S)",
          )
          exec(compile(script, '<snake-fade-v2-patch>', 'exec'), {})
          PY
      - name: Install Linux Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libopengl0 libpulse0 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0
      - name: Install StepNX Studio with GUI dependencies
        run: python -m pip install -e '.[gui]'
      - name: Run complete repository suite
        run: python -m unittest discover -s tests -v
      - name: Commit verified corrections
        run: |
          git config user.name 'OpenAI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-snake-continuity-visibility-fade.yml
          git rm .github/workflows/fix-snake-continuity-visibility-fade-v2.yml
          git rm .github/workflows/fix-snake-continuity-visibility-fade-v3.yml
          git add src/stepnx/preview/visuals.py \
                  src/stepnx/preview/commands.py \
                  src/stepnx/gui/preview_widget.py \
                  tests/unit/test_rise_visual_modifiers.py \
                  tests/unit/test_preview.py \
                  tests/unit/test_qt_preview.py \
                  docs/RISE_RUNTIME_PARITY_HANDOFF.md
          git diff --cached --check
          git commit -m 'Smooth Snake Path and restore visibility fades'
          git push origin HEAD:audit/rise-visual-command-re
