name: Refresh Prime/NXA visual handoff

on:
  push:
    branches:
      - audit/rise-visual-command-re

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message == 'Install Prime/NXA handoff refresh workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/rise-visual-command-re
      - name: Refresh recovered visual behavior notes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected documentation fragment not found: {path}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          handoff = 'docs/RISE_RUNTIME_PARITY_HANDOFF.md'
          replace_once(
              handoff,
              '''The previous synthetic pixel powers were removed. `TryGetMaxVisibleSplitLocalY` can substitute a grouped child maximum before this scalar formula; flattened preview events cannot reproduce that grouping perfectly and the limitation is explicit.\n\n### Snake\n''',
              '''The previous synthetic pixel powers were removed. `TryGetMaxVisibleSplitLocalY` can substitute a grouped child maximum before this scalar formula; flattened preview events cannot reproduce that grouping perfectly and the limitation is explicit.\n\nThat modern Header path is **not** the historical PIUTESTER/NX2 Acceleration/Deceleration command path. The supplied unpacked Prime 1 and NXA executables independently agree on the older renderer. With `x = beatDistance * 60 * highSpeed`:\n\n```text\nAcceleration (mode 1): 600 - 50000 / (x + 83.33333587646484)\nDeceleration (mode 2): x^3 / 1600\n```\n\nPrime 1 uses the same constants through its SSE branch around `0x806D350..0x806D809`; NXA reproduces them through the x87 branch around `0x8093475..0x809377C`. StepNX now keeps these historical A/D commands separate from the R!SE Header ID 2 LineBase curve instead of incorrectly routing both through one formula.\n\n### Under Attack / Drop\n\nPrime 1 confirms the sequence-zone transform applies to the complete rendered field, not just the receptor strip. Under Attack performs the 180-degree field rotation; the same painter transform therefore affects receptor artwork, note positions, note artwork, holds and pad feedback. Drop remains the independent vertical-flip bit. Their composition is preserved as the native bitmask rather than collapsed into a lane permutation.\n\n### Snake\n''',
          )
          replace_once(
              handoff,
              '''before writing `_modeSpeedExt`. StepNX uses the exact line gate, 1/60 s DrawStep cadence, repeated rerolls while a qualifying line remains current, and signed modulo conversion. The exact Unity RNG stream is still unrecovered, so a deterministic Python RNG supplies the sequence; that sequence is the remaining approximation.\n\n### COMMAND launch selector\n''',
              '''before writing `_modeSpeedExt`. StepNX uses the exact line gate, 1/60 s DrawStep cadence, repeated rerolls while a qualifying line remains current, and signed modulo conversion. The standalone preview intentionally uses its deterministic RNG rather than attempting to clone Unity's private RNG state; exact RNG identity is not a parity requirement for this modifier.\n\n### ZigZag\n\nPrime 1 contains a live `path_zigzag` consumer around `0x806D6EF`. Split param 222 is the path start and param 221 is the keyframe interval; both default to 1. After the start, the renderer interpolates through nine lane-permutation keyframes for phase 0 through 8 and then holds keyframe eight. The permutation generator uses the recovered 32-bit LCG:\n\n```text\nstate = state * 0x0019660D + 0x3C6EF35F\npick  = (state >> 8) % remaining\n```\n\nStepNX ports that consumer and preserves Split 221/222 into the runtime stream. Prime also mixes an engine-owned per-player value into the initial seed; the standalone preview substitutes its resolved route seed, so the path mechanics are recovered while the exact native permutation sequence is intentionally preview-local. Header ZigZag state now drives this path.\n\n### COMMAND launch selector\n''',
          )
          replace_once(
              handoff,
              '''Do not invent transforms for:\n\n- ZigZag: `Effects.bZigZag=0x10`, Header `bZigZag`, and Div params 221/222 are known, but a sufficiently strong direct gameplay consumer has not been recovered;\n- R!SE's exact Throw Animator/asset movement; the preview intentionally uses the recovered Prime 2 sine path as a historical compatibility projection;\n- exact Appear/Vanish Animator/material fade curves;\n- exact Random Velocity Unity RNG sequence.\n''',
              '''Do not invent transforms for:\n\n- R!SE's exact Throw Animator/asset movement; the preview intentionally uses the recovered Prime 2 sine path as a historical compatibility projection;\n- exact Appear/Vanish Animator/material fade curves.\n\nZigZag is no longer source-gated: Prime 1 supplied the historical consumer. Random Velocity's exact Unity RNG sequence is deliberately not a parity target; its gate, cadence and speed conversion are the behaviorally relevant pieces.\n''',
          )
          replace_once(
              handoff,
              '''GitHub Actions run: 33269051446\nCommit tested: 0549562fa48f8927e1193fbc6059c5b21698b007\nRan 486 tests\nOK\n''',
              '''GitHub Actions run: 33274239781\nCommit tested before the resulting production commit: 9f540e350fcb27e66bb8e61b4c305405258d8c6f\nProduction commit: 9aebcb53634fbdc14462dc1553a77a0d6cacc3d9\nRan 491 tests in 4.477s\nOK\n''',
          )
          replace_once(
              handoff,
              '''This checkpoint includes dedicated regressions for independent UA/Drop bitmask geometry, row-wise Random projection with hold continuity, Accel/Decel transform order, Prime 2 Snake amplitude 30, Prime 2 Sink/Rise paths, Header Visibility without document mutation, Earthworm fixed DrawStep cadence, Random Velocity repeated qualifying-line rerolls, external-advance chunk invariance, and the 18-entry semantic modifier selector. Path-modified long-note shafts are rendered by sampling the same trajectory as their note heads.\n''',
              '''This checkpoint includes dedicated regressions for independent UA/Drop bitmask geometry, whole-field Under Attack rotation, row-wise Random projection with hold continuity, the Prime/NXA historical Acceleration/Deceleration formulas, the distinct R!SE Header AccDec curve, Prime 2 Snake amplitude 30, Prime 2 Sink/Rise paths, Prime 1 ZigZag keyframes plus Split 221/222 preservation, Header Visibility without document mutation, Earthworm fixed DrawStep cadence, Random Velocity repeated qualifying-line rerolls, external-advance chunk invariance, and the complete 18-entry semantic modifier selector. Path-modified long-note shafts are rendered by sampling the same trajectory as their note heads.\n''',
          )
          replace_once(
              handoff,
              '''- exact ZigZag transform consumer;\n- exact R!SE Throw Animator/asset curve; the preview uses the recovered Prime 2 historical sine projection instead;\n- exact Random Velocity Unity RNG sequence; gate, conversion and DrawStep cadence are implemented;\n- exact Appear/Vanish Animator/material curves; the current fade is an explicit visual approximation;\n''',
              '''- exact R!SE Throw Animator/asset curve; the preview uses the recovered Prime 2 historical sine projection instead;\n- exact Appear/Vanish Animator/material curves; the current fade is an explicit visual approximation;\n''',
          )

          audit = 'docs/RISE_RUNTIME_PARITY_AUDIT.md'
          replace_once(
              audit,
              '''| RV-002 | Accel / Decel | FIXED scalar path | `LineBase.GetAccDecYOffset()` normalizes Y over `_yMin=200`..`_yMax=550`; Accel is `(1-pow(t,1.5))*-200`, Decel is `pow(1-t,1.5)*-200`, then `_accScale=1`. | Synthetic pixel powers were removed. The flattened preview cannot exactly reproduce `TryGetMaxVisibleSplitLocalY` aggregation for grouped split children, so that grouping detail remains an explicit presentation limitation. |''',
              '''| RV-002 | Accel / Decel | FIXED, generation-separated | R!SE Header ID 2 uses `LineBase.GetAccDecYOffset()` with the normalized 1.5-power curves. Prime 1 and NXA independently prove the historical launch-command path: with `x=beatDistance*60*highSpeed`, Acceleration is `600-50000/(x+83.33333587646484)` and Deceleration is `x^3/1600`. | Header state keeps the R!SE LineBase path; PIUTESTER/NX2 A/D now use the Prime/NXA formulas instead of conflating the two generations. |''',
          )
          replace_once(
              audit,
              '''| RV-005 | Random Velocity | APPROXIMATION only for RNG stream | DrawStep gate is exact `Line % 48 == 0`; native RNG result is converted with signed `% 4 + 1` before updating `_modeSpeedExt`, and DrawStep rerolls on each update while the qualifying line remains current. | Gate, 1/60 s cadence, repeated qualifying-line reroll, and `%4+1` conversion are implemented. Python's deterministic RNG substitutes for the unrecovered Unity RNG sequence, which is the remaining approximation. |''',
              '''| RV-005 | Random Velocity | FIXED behavioral projection | DrawStep gate is exact `Line % 48 == 0`; native RNG result is converted with signed `% 4 + 1` before updating `_modeSpeedExt`, and DrawStep rerolls on each update while the qualifying line remains current. | Gate, 1/60 s cadence, repeated qualifying-line reroll and `%4+1` conversion are implemented. The preview uses a deterministic local RNG; matching Unity's internal RNG state is deliberately not a parity requirement. |''',
          )
          replace_once(
              audit,
              '''| RV-007 | ZigZag | OPEN | `Effects.bZigZag=0x10`, Header `GameModifier.bZigZag`, and Div params 221/222 are named in metadata. | No source-supported gameplay transform consumer has been recovered strongly enough to replace this with a guessed animation. State/raw bits remain preserved. |''',
              '''| RV-007 | ZigZag | FIXED historical projection | Prime 1 has a live `path_zigzag` consumer around `0x806D6EF`: Div 222=start, Div 221=interval, nine interpolated lane-permutation keyframes for phase 0..8, generated with the recovered `state=state*0x0019660D+0x3C6EF35F` LCG. | Header ZigZag drives the recovered path and Split 221/222 are retained in the runtime stream. The engine-owned per-player seed contribution is unavailable, so the resolved route seed initializes the otherwise recovered permutation generator. |''',
          )
          replace_once(
              audit,
              '''| RV-008 | Throw | FIXED historical compatibility projection | R!SE exposes Flat/Sink/Rise and `LineBase.PlayThrowAnim()` but delegates movement to Animator/assets. Prime 2 provides a reproducible historical sine path: span 453, amplitude 96, with Rise reversing the sign. | Preview uses the Prime 2 path as an explicit compatibility projection for Sink/Rise. Path-modified long shafts follow the sampled curve. The unidentified Prime 2 alternate 300-unit producer is not enabled. |''',
              '''| RV-008 | Throw | FIXED historical compatibility projection | R!SE exposes Flat/Sink/Rise and `LineBase.PlayThrowAnim()` but delegates movement to Animator/assets. Prime 2 provides a reproducible historical sine path: span 453, amplitude 96, with Rise reversing the sign. | Preview uses the Prime 2 path as an explicit compatibility projection for Sink/Rise. Path-modified long shafts follow the sampled curve. The unidentified Prime 2 alternate 300-unit producer is not enabled. |\n| RV-009 | Under Attack / Drop | FIXED | Prime 1 applies sequence-zone matrix transforms around the whole rendered field; Under Attack uses a 180-degree rotation and Drop is the independent vertical flip. | The shared painter transform covers receptor artwork, note coordinates, note artwork, holds and pad feedback; input mapping follows the transformed field. |''',
          )
          replace_once(
              audit,
              '''GitHub Actions run: 33256211227\nCommit tested: 9ff6f29f042a41e4e163e0df81d88074eb95a622\nRan 476 tests in 1.975s\nOK\n''',
              '''GitHub Actions run: 33274239781\nProduction commit: 9aebcb53634fbdc14462dc1553a77a0d6cacc3d9\nRan 491 tests in 4.477s\nOK\n''',
          )
          PY
      - name: Validate public documentation
        run: python -m unittest tests.unit.test_public_documentation -v
      - name: Commit refreshed handoff and remove one-shot workflow
        run: |
          git config user.name 'OpenAI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/refresh-prime-nxa-handoff.yml
          git add docs/RISE_RUNTIME_PARITY_HANDOFF.md docs/RISE_RUNTIME_PARITY_AUDIT.md
          git diff --cached --check
          git commit -m 'Document Prime and NXA visual consumers'
          git push origin HEAD:audit/rise-visual-command-re
