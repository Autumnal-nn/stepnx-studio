name: Apply visual parity completion patch

on:
  push:
    branches:
      - audit/rise-visual-command-re

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply visual parity completion patch'
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/rise-visual-command-re
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply source-supported visual completion patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected source fragment not found in {path}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          widget = 'src/stepnx/gui/preview_widget.py'
          replace_once(widget, '    native_snake_x_offset,\n', '')
          replace_once(
              widget,
              '''        # R!SE Header Snake is source-exact and uses a 20-unit LineBase sine.\n        if self.session.runtime_modifier.snake:\n            offset += native_snake_x_offset(\n                self._event_local_y(event),\n                geometry.note_size,\n            )\n\n        # The legacy/NX2 Snake path is distinct. Prime 2 establishes the final\n        # amplitude as 60 * 0.5 = 30 units, so do not reuse R!SE's 20 here.\n        if self.command.snake:\n            offset += prime2_snake_x_offset(\n                self._event_beat_distance(event),\n                geometry.note_size,\n            )\n''',
              '''        # The R!SE build preserves Snake state/constants but has no validated\n        # gameplay consumer for that state. Do not promote its dormant 20-unit\n        # LineBase helper into behavior. Prime 2 is the historical runtime arbiter:\n        # both Header/metadata Snake and the launch option use its 30-unit path.\n        if self.command.snake or self.session.runtime_modifier.snake:\n            offset += prime2_snake_x_offset(\n                self._event_beat_distance(event),\n                geometry.note_size,\n            )\n''',
          )
          replace_once(
              widget,
              '''        return offset\n\n    def _event_opacity(self, event: PreviewEvent) -> float:\n''',
              '''        return offset\n\n    def _path_modifiers_active(self) -> bool:\n        return bool(\n            self.command.snake\n            or self.session.runtime_modifier.snake\n            or self.command.exceed_mode\n            or self.session.runtime_modifier.exceed\n            or self._effective_throw() is not ThrowMode.FLAT\n        )\n\n    def _screen_y_for_beat_distance(self, beat_distance: float) -> float:\n        geometry = self._geometry()\n        native_y = native_line_y(\n            beat_distance,\n            self.session.high_speed,\n            self._effective_acc_dec(),\n        )\n        y = native_screen_y(\n            native_y,\n            self._receptor_y(),\n            geometry.note_size,\n        )\n        mode = self._effective_throw()\n        if mode is not ThrowMode.FLAT:\n            y += prime2_throw_y_offset(\n                beat_distance,\n                self.session.high_speed,\n                geometry.note_size,\n                rise=mode is ThrowMode.RISE,\n            )\n        return y\n\n    def _path_x_for_beat_distance(\n        self, beat_distance: float, lane: int, y: float\n    ) -> float:\n        geometry = self._geometry()\n        offset = 0.0\n        if self.command.snake or self.session.runtime_modifier.snake:\n            offset += prime2_snake_x_offset(beat_distance, geometry.note_size)\n        if self.command.exceed_mode or self.session.runtime_modifier.exceed:\n            centre_lane = (self.columns - 1) / 2.0\n            if lane != centre_lane:\n                offset += legacy_exceed_x_offset(\n                    y - self._receptor_y(),\n                    geometry.field_width,\n                    from_right=lane < centre_lane,\n                    travel_height=float(self.height()),\n                )\n        return self.lane_center(lane) + offset\n\n    def _event_opacity(self, event: PreviewEvent) -> float:\n''',
          )
          replace_once(
              widget,
              '''    def _draw_hold_shafts(self, painter: QPainter, note_size: float) -> None:\n        for head, tail in self._hold_pairs:\n            if tail.time_ms < self._chart_time_ms - 80.0:\n                continue\n            y1, y2 = self._event_y(head), self._event_y(tail)\n            if head.time_ms <= self._chart_time_ms <= tail.time_ms:\n                y1 = self._receptor_y()\n            if max(y1, y2) < -100 or min(y1, y2) > self.height() + 100:\n                continue\n            centre = self.lane_center(tail.lane)\n            target = QRectF(\n                centre - note_size / 2,\n                min(y1, y2),\n                note_size,\n                max(2.0, abs(y2 - y1)),\n            )\n            bank = (\n                None\n                if self._noteskin_pack is None\n                else self._noteskin_pack.bank(head.raw[2])\n            )\n            drawn = False\n            painter.save()\n            painter.setOpacity(self._event_opacity(head))\n            if bank is not None:\n                frame = int(max(0.0, self._chart_time_ms) // 80) % len(\n                    bank.animation\n                )\n                atlas = bank.animation[frame]\n                pixmap = self._pixmap(atlas)\n                if pixmap is not None:\n                    atlas_lane = (\n                        self.start_column + self._visual_lane(tail.lane)\n                    ) % 5\n                    tile_x, tile_y, tile_width, _ = atlas.tile(atlas_lane, 0)\n                    painter.drawPixmap(\n                        target,\n                        pixmap,\n                        QRectF(tile_x, tile_y, tile_width, 8),\n                    )\n                    drawn = True\n            if not drawn:\n                width = max(8.0, note_size * 0.34)\n                painter.fillRect(\n                    QRectF(\n                        centre - width / 2,\n                        min(y1, y2),\n                        width,\n                        max(2.0, abs(y2 - y1)),\n                    ),\n                    QColor(88, 160, 230, 210),\n                )\n            painter.restore()\n''',
              '''    def _draw_hold_shafts(self, painter: QPainter, note_size: float) -> None:\n        for head, tail in self._hold_pairs:\n            if tail.time_ms < self._chart_time_ms - 80.0:\n                continue\n\n            # Path modifiers cannot be represented by stretching one vertical atlas\n            # strip between transformed endpoints. Sample the same trajectory used\n            # by note heads so Snake/Throw/Exceed longs remain continuous.\n            if self._path_modifiers_active():\n                start_distance = self._event_beat_distance(head)\n                end_distance = self._event_beat_distance(tail)\n                if head.time_ms <= self._chart_time_ms <= tail.time_ms:\n                    start_distance = 0.0\n                span = abs(end_distance - start_distance)\n                sample_count = max(12, min(72, int(span * 10.0) + 2))\n                path = QPainterPath()\n                visible = False\n                for index in range(sample_count):\n                    ratio = index / max(1, sample_count - 1)\n                    distance = start_distance + (end_distance - start_distance) * ratio\n                    y = self._screen_y_for_beat_distance(distance)\n                    x = self._path_x_for_beat_distance(distance, tail.lane, y)\n                    if -120.0 <= y <= self.height() + 120.0:\n                        visible = True\n                    if index == 0:\n                        path.moveTo(x, y)\n                    else:\n                        path.lineTo(x, y)\n                if not visible:\n                    continue\n                painter.save()\n                painter.setOpacity(self._event_opacity(head))\n                pen = QPen(QColor(88, 160, 230, 210))\n                pen.setWidthF(max(8.0, note_size * 0.34))\n                pen.setCapStyle(Qt.PenCapStyle.RoundCap)\n                pen.setJoinStyle(Qt.PenJoinStyle.RoundJoin)\n                painter.setPen(pen)\n                painter.setBrush(Qt.BrushStyle.NoBrush)\n                painter.drawPath(path)\n                painter.restore()\n                continue\n\n            y1, y2 = self._event_y(head), self._event_y(tail)\n            if head.time_ms <= self._chart_time_ms <= tail.time_ms:\n                y1 = self._receptor_y()\n            if max(y1, y2) < -100 or min(y1, y2) > self.height() + 100:\n                continue\n            centre = self.lane_center(tail.lane)\n            target = QRectF(\n                centre - note_size / 2,\n                min(y1, y2),\n                note_size,\n                max(2.0, abs(y2 - y1)),\n            )\n            bank = (\n                None\n                if self._noteskin_pack is None\n                else self._noteskin_pack.bank(head.raw[2])\n            )\n            drawn = False\n            painter.save()\n            painter.setOpacity(self._event_opacity(head))\n            if bank is not None:\n                frame = int(max(0.0, self._chart_time_ms) // 80) % len(\n                    bank.animation\n                )\n                atlas = bank.animation[frame]\n                pixmap = self._pixmap(atlas)\n                if pixmap is not None:\n                    atlas_lane = (\n                        self.start_column + self._visual_lane(tail.lane)\n                    ) % 5\n                    tile_x, tile_y, tile_width, _ = atlas.tile(atlas_lane, 0)\n                    painter.drawPixmap(\n                        target,\n                        pixmap,\n                        QRectF(tile_x, tile_y, tile_width, 8),\n                    )\n                    drawn = True\n            if not drawn:\n                width = max(8.0, note_size * 0.34)\n                painter.fillRect(\n                    QRectF(\n                        centre - width / 2,\n                        min(y1, y2),\n                        width,\n                        max(2.0, abs(y2 - y1)),\n                    ),\n                    QColor(88, 160, 230, 210),\n                )\n            painter.restore()\n''',
          )

          tests = 'tests/unit/test_rise_visual_modifiers.py'
          replace_once(tests, '    LINE_BASE_X_AMPLITUDE,\n', '')
          replace_once(tests, '    native_snake_x_offset,\n', '')
          replace_once(
              tests,
              '        self.assertEqual(LINE_BASE_X_AMPLITUDE, 20.0)\n',
              '',
          )
          replace_once(
              tests,
              '''    def test_rise_snake_keeps_modern_twenty_unit_amplitude(self) -> None:\n        span = LINE_BASE_Y_MAX - LINE_BASE_Y_MIN\n        self.assertAlmostEqual(\n            native_snake_x_offset(LINE_BASE_Y_MIN + span * 0.25, 72.0),\n            20.0,\n            places=6,\n        )\n        self.assertAlmostEqual(\n            native_snake_x_offset(LINE_BASE_Y_MIN + span * 0.75, 72.0),\n            -20.0,\n            places=6,\n        )\n\n''',
              '',
          )
          replace_once(
              tests,
              '''    def test_non_ui_command_order_resolves_mutually_exclusive_speed_modes(self) -> None:\n''',
              '''    def test_speed_modes_are_independent_of_external_advance_chunking(self) -> None:\n        _, stream = _stream_with_header(1, 1)\n        coarse = GameplaySession(stream, parse_gameplay_command(""), autoplay=True)\n        fine = GameplaySession(stream, parse_gameplay_command(""), autoplay=True)\n\n        coarse.advance(260.0)\n        for moment in range(10, 261, 10):\n            fine.advance(float(moment))\n\n        self.assertEqual(coarse.mode_speed, fine.mode_speed)\n        self.assertEqual(coarse.high_speed, fine.high_speed)\n        self.assertEqual(coarse.block_speed, fine.block_speed)\n\n    def test_random_velocity_rerolls_each_drawstep_tick_on_qualifying_line(self) -> None:\n        import random\n\n        _, stream = _stream_with_header(1, 2)\n        session = GameplaySession(stream, parse_gameplay_command(""), autoplay=True)\n        expected_rng = random.Random(stream.route.seed or 0)\n\n        first = random_velocity_user_speed(expected_rng.randrange(0, 0x7FFFFFFF))\n        second = random_velocity_user_speed(expected_rng.randrange(0, 0x7FFFFFFF))\n\n        session.advance(17.0)\n        self.assertEqual(session.mode_speed, first)\n        session.advance(34.0)\n        self.assertEqual(session.mode_speed, second)\n\n    def test_non_ui_command_order_resolves_mutually_exclusive_speed_modes(self) -> None:\n''',
          )

          commands = 'src/stepnx/preview/commands.py'
          replace_once(
              commands,
              '            # R!SE trigger/range is exact, but its RNG stream/cadence is not yet exact.\n            ("S", self.random_velocity),\n',
              '            # R!SE gate/cadence/conversion are exact; Unity RNG sequence remains approximate.\n            ("S", self.random_velocity),\n',
          )
          PY
      - name: Install Linux Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libopengl0 \
            libpulse0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-xinerama0
      - name: Install StepNX Studio with GUI dependencies
        run: python -m pip install -e '.[gui]'
      - name: Run complete suite before committing
        run: python -m unittest discover -s tests -v
      - name: Commit completed implementation
        run: |
          git config user.name 'OpenAI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/stepnx/gui/preview_widget.py src/stepnx/preview/commands.py tests/unit/test_rise_visual_modifiers.py
          git diff --cached --check
          git commit -m 'Complete historical visual modifier projection'
          git push origin HEAD:audit/rise-visual-command-re
