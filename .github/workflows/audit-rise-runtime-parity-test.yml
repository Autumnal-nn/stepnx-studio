name: Audit RISE Runtime Parity Test

on:
  push:
    branches:
      - audit/rise-runtime-parity-item2-work

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2 libegl1 libgl1 libpulse0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libxkbcommon-x11-0
      - name: Install StepNX Studio
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui]"
      - name: Run full test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
