name: Final RISE visual parity audit

on:
  push:
    branches:
      - audit/rise-visual-command-re

jobs:
  test:
    if: github.event.head_commit.message == 'Run final runtime parity audit'
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install StepNX Studio with GUI dependencies
        run: python -m pip install -e '.[gui]'
      - name: Run complete auditable test suite
        run: python -m unittest discover -s tests -v
