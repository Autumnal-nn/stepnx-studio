name: Fix legacy visual follow-up

on:
  push:
    branches:
      - audit/rise-visual-command-re

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Install legacy visual follow-up workflow'
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/rise-visual-command-re
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply legacy visual corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected source fragment not found in {path}: {old[:120]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Prime's Sink/Rise sine is Z depth, not Y displacement. The gameplay
          # camera uses fov=43.603 and a 480px viewport, which gives eye Z=600.
          visuals = 'src/stepnx/preview/visuals.py'
          replace_once(
              visuals,
              '''PRIME2_THROW_ALT_AMPLITUDE = 300.0  # 200 * 1.5, external-state branch (OPEN)\n\n# Prime 1 and NXA use the same legacy Acceleration/Deceleration renderer.\n''',
              '''PRIME2_THROW_ALT_AMPLITUDE = 300.0  # 200 * 1.5, external-state branch (OPEN)\nPRIME2_THROW_CAMERA_FOV = 43.60300064086914\nPRIME2_THROW_CAMERA_EYE_Z = 600.0\n\n# Prime 1 and NXA use the same legacy Acceleration/Deceleration renderer.\n''',
          )
          replace_once(
              visuals,
              '''def prime2_throw_y_offset(\n    beat_distance: float,\n    high_speed: float,\n    note_size: float,\n    *,\n    rise: bool,\n    alternate_amplitude: bool = False,\n) -> float:\n    \"\"\"Port Prime 2's standard Sink/Rise sine path.\n\n    The renderer first forms ``d = beat_distance * 60 * speed`` and then applies\n    ``sin(pi*d/453) * amplitude``. Standard Sink uses +96 and Rise uses -96.\n    Prime 2 also contains an external-state branch selecting +/-300; the state\n    producer is still unidentified, so StepNX never enables it implicitly.\n    \"\"\"\n\n    displacement = float(beat_distance) * PRIME2_PATH_UNIT * float(high_speed)\n    amplitude = (\n        PRIME2_THROW_ALT_AMPLITUDE\n        if alternate_amplitude\n        else PRIME2_THROW_AMPLITUDE\n    )\n    if rise:\n        amplitude = -amplitude\n    native_y = sin(PRIME2_PATH_PI * displacement / PRIME2_THROW_SPAN) * amplitude\n    return native_y * (float(note_size) / PRIME2_PATH_UNIT)\n''',
              '''def prime2_throw_z_offset(\n    beat_distance: float,\n    high_speed: float,\n    *,\n    rise: bool,\n    alternate_amplitude: bool = False,\n) -> float:\n    \"\"\"Return Prime's native Sink/Rise Z coordinate.\n\n    `piu_prime` writes the recovered sine term into the third coordinate of all\n    four arrow vertices at 0x806DEAE/BD/CC/E1. It is therefore depth, not a Y\n    offset. Standard amplitude is 96; the unidentified alternate branch is 300.\n    \"\"\"\n\n    displacement = float(beat_distance) * PRIME2_PATH_UNIT * float(high_speed)\n    amplitude = (\n        PRIME2_THROW_ALT_AMPLITUDE\n        if alternate_amplitude\n        else PRIME2_THROW_AMPLITUDE\n    )\n    if rise:\n        amplitude = -amplitude\n    return sin(PRIME2_PATH_PI * displacement / PRIME2_THROW_SPAN) * amplitude\n\n\ndef prime2_throw_perspective_scale(\n    z: float, *, eye_z: float = PRIME2_THROW_CAMERA_EYE_Z\n) -> float:\n    \"\"\"Project Prime's uniform arrow Z into the 2-D preview scale.\n\n    Prime sets `gluPerspective(43.603..., aspect, .1, 5000)` and uses a\n    `gluLookAt` eye distance of 600 for the native 480-high gameplay viewport.\n    A quad translated uniformly in Z therefore scales about screen centre by\n    ``eye_z / (eye_z - z)``.\n    \"\"\"\n\n    denominator = float(eye_z) - float(z)\n    if denominator <= 1.0:\n        return float(eye_z)\n    return float(eye_z) / denominator\n\n\ndef prime2_throw_y_offset(\n    beat_distance: float,\n    high_speed: float,\n    note_size: float,\n    *,\n    rise: bool,\n    alternate_amplitude: bool = False,\n) -> float:\n    \"\"\"Compatibility wrapper for the old, incorrectly named helper.\n\n    This returns the historical scaled sine magnitude only. Rendering must use\n    `prime2_throw_z_offset` plus perspective projection; the value is not Y.\n    \"\"\"\n\n    return prime2_throw_z_offset(\n        beat_distance,\n        high_speed,\n        rise=rise,\n        alternate_amplitude=alternate_amplitude,\n    ) * (float(note_size) / PRIME2_PATH_UNIT)\n''',
          )

          # Div 221/222 live in Block division metadata in real charts. Preserve
          # them at the correct level instead of accidentally reading Split metadata.
          snapshot = 'src/stepnx/preview/snapshot.py'
          replace_once(
              snapshot,
              '''    brain_question_count: int\n\n\n@dataclass(frozen=True, slots=True)\nclass PreviewSplit:\n''',
              '''    brain_question_count: int\n    step_params: tuple[StepParam, ...] = ()\n\n\n@dataclass(frozen=True, slots=True)\nclass PreviewSplit:\n''',
          )
          replace_once(
              snapshot,
              '''                    () if branch is None else branch.triggers,\n                    max(0, question_count),\n                )\n''',
              '''                    () if branch is None else branch.triggers,\n                    max(0, question_count),\n                    _step_params(block.divisions),\n                )\n''',
          )

          events = 'src/stepnx/preview/events.py'
          replace_once(
              events,
              '''    columns: int = 5\n    split_step_params: tuple[tuple[int, tuple[StepParam, ...]], ...] = ()\n\n    def split_param(\n''',
              '''    columns: int = 5\n    split_step_params: tuple[tuple[int, tuple[StepParam, ...]], ...] = ()\n    block_step_params: tuple[tuple[int, tuple[StepParam, ...]], ...] = ()\n\n    def split_param(\n''',
          )
          replace_once(
              events,
              '''        return float(default)\n\n    @property\n    def duration_ms(self) -> float:\n''',
              '''        return float(default)\n\n    def block_param(\n        self, block_id: int, metadata_id: int, default: float = 1.0\n    ) -> float:\n        \"\"\"Return the first matching Div/Block StepParam as a signed float.\"\"\"\n\n        for current_block_id, params in self.block_step_params:\n            if current_block_id != int(block_id):\n                continue\n            for param in params:\n                if param.metadata_id == int(metadata_id):\n                    return float(param.signed_value)\n            break\n        return float(default)\n\n    @property\n    def duration_ms(self) -> float:\n''',
          )
          replace_once(
              events,
              '''        tuple((split.stable_id, split.step_params) for split in snapshot.splits),\n    )\n''',
              '''        tuple((split.stable_id, split.step_params) for split in snapshot.splits),\n        tuple(\n            (block.stable_id, block.step_params)\n            for split in snapshot.splits\n            for block in split.blocks\n        ),\n    )\n''',
          )

          # Legacy Vanish/Appear are screen-half display gates. The previous
          # receptor-distance gradient was an invented behavior and contradicted
          # both the original renderer and direct gameplay captures.
          commands = 'src/stepnx/preview/commands.py'
          replace_once(
              commands,
              '''    def note_opacity(\n        self,\n        visibility: int,\n        *,\n        distance: float,\n        fade_distance: float,\n        time_ms: float,\n    ) -> float:\n        \"\"\"Render loaded note visibility plus COMMAND-only display effects.\n\n        Header Visibility has already rewritten the runtime event's VisualEffect\n        nibble before this function is called. Exact Unity material curves remain\n        asset-dependent; PIUTESTER/NX2 command semantics are represented as the\n        same independent Vanish/Appear bits, where both active means Hidden.\n        \"\"\"\n\n        if self.nonstep or visibility == 0 or (self.vanish and self.appear):\n            return 0.0\n        span = max(1.0, float(fade_distance))\n        normalized = max(0.0, float(distance)) / span\n        if visibility == 1:  # Appear\n            opacity = 1.0 - normalized\n        elif visibility == 2:  # Vanish\n            opacity = normalized\n        else:  # Visible and unknown high-bit combinations\n            opacity = 1.0\n        if self.appear:\n            opacity = min(opacity, 1.0 - normalized)\n        if self.vanish:\n            opacity = min(opacity, normalized)\n        if self.flash and int(float(time_ms) // 100.0) % 2:\n            opacity = 0.0\n        return min(1.0, max(0.0, opacity))\n''',
              '''    def note_opacity(\n        self,\n        visibility: int,\n        *,\n        screen_y: float,\n        screen_midline: float,\n        time_ms: float,\n    ) -> float:\n        \"\"\"Render legacy display modes around the physical screen midline.\n\n        Vanish is visible on the approach half and disappears after crossing the\n        centre line. Appear is the inverse. Header Visibility has already\n        rewritten the event's low VisualEffect bits before this function runs.\n        \"\"\"\n\n        if self.nonstep or visibility == 0 or (self.vanish and self.appear):\n            return 0.0\n        below_midline = float(screen_y) >= float(screen_midline)\n        if visibility == 1:  # Appear: visible only after crossing centre.\n            opacity = 0.0 if below_midline else 1.0\n        elif visibility == 2:  # Vanish: visible only before crossing centre.\n            opacity = 1.0 if below_midline else 0.0\n        else:\n            opacity = 1.0\n        if self.appear:\n            opacity = min(opacity, 0.0 if below_midline else 1.0)\n        if self.vanish:\n            opacity = min(opacity, 1.0 if below_midline else 0.0)\n        if self.flash and int(float(time_ms) // 100.0) % 2:\n            opacity = 0.0\n        return opacity\n''',
          )

          widget = 'src/stepnx/gui/preview_widget.py'
          replace_once(
              widget,
              '''    prime2_snake_x_offset,\n    prime2_throw_y_offset,\n    prime2_zigzag_lane_position,\n''',
              '''    prime2_snake_x_offset,\n    prime2_throw_perspective_scale,\n    prime2_throw_z_offset,\n    prime2_zigzag_lane_position,\n''',
          )
          replace_once(
              widget,
              '''        self._hold_pairs = self._pair_holds(stream.events)\n        self._paint_timestamps: deque[float] = deque(maxlen=120)\n''',
              '''        self._hold_pairs = self._pair_holds(stream.events)\n        self._hold_pair_by_event = {\n            event: (head, tail)\n            for head, tail in self._hold_pairs\n            for event in (head, tail)\n        }\n        self._paint_timestamps: deque[float] = deque(maxlen=120)\n''',
          )
          replace_once(
              widget,
              '''    def _event_throw_y_offset(self, event: PreviewEvent) -> float:\n        mode = self._effective_throw()\n        if mode is ThrowMode.FLAT:\n            return 0.0\n        return prime2_throw_y_offset(\n            self._event_beat_distance(event),\n            self.session.high_speed,\n            self._geometry().note_size,\n            rise=mode is ThrowMode.RISE,\n        )\n\n''',
              '''    def _path_anchor(\n        self, event: PreviewEvent\n    ) -> tuple[PreviewEvent, float]:\n        \"\"\"Return the rigid path anchor used by legacy long notes.\"\"\"\n\n        pair = self._hold_pair_by_event.get(event)\n        if pair is None:\n            return event, self._event_beat_distance(event)\n        head, tail = pair\n        if head.time_ms <= self._chart_time_ms <= tail.time_ms:\n            return head, 0.0\n        return head, self._event_beat_distance(head)\n\n    def _throw_projection(\n        self, x: float, y: float, beat_distance: float\n    ) -> tuple[float, float, float]:\n        \"\"\"Project Prime's uniform Z depth around the screen centre.\"\"\"\n\n        mode = self._effective_throw()\n        if mode is ThrowMode.FLAT:\n            return float(x), float(y), 1.0\n        z = prime2_throw_z_offset(\n            beat_distance,\n            self.session.high_speed,\n            rise=mode is ThrowMode.RISE,\n        )\n        scale = prime2_throw_perspective_scale(z)\n        centre_x = float(self.width()) / 2.0\n        centre_y = float(self.height()) / 2.0\n        return (\n            centre_x + (float(x) - centre_x) * scale,\n            centre_y + (float(y) - centre_y) * scale,\n            scale,\n        )\n\n''',
          )
          replace_once(
              widget,
              '''    def _event_y(self, event: PreviewEvent) -> float:\n        return self._base_screen_y_for_beat_distance(\n            self._event_beat_distance(event)\n        ) + self._event_throw_y_offset(event)\n''',
              '''    def _event_y(self, event: PreviewEvent) -> float:\n        return self._base_screen_y_for_beat_distance(self._event_beat_distance(event))\n''',
          )
          # Replace path X resolution so longs share one anchor, ZigZag reads
          # block metadata, and Single Exceed uses player side rather than lane.
          replace_once(
              widget,
              '''    def _event_x_offset(self, event: PreviewEvent) -> float:\n        geometry = self._geometry()\n        offset = 0.0\n\n        if self.session.runtime_modifier.zigzag:\n            visual_lane = self._visual_lane(event.lane)\n            lane_position = prime2_zigzag_lane_position(\n                visual_lane,\n                self._event_beat_distance(event),\n                self.columns,\n                self.stream.route.seed or 0,\n                start=self.stream.split_param(event.split_id, 222, 1.0),\n                interval=self.stream.split_param(event.split_id, 221, 1.0),\n            )\n            offset += self._lane_position_x(lane_position) - self.lane_center(event.lane)\n\n        # The R!SE build preserves Snake state/constants but has no validated\n        # gameplay consumer for that state. Do not promote its dormant 20-unit\n        # LineBase helper into behavior. Prime 2 is the historical runtime arbiter:\n        # both Header/metadata Snake and the launch option use its 30-unit path.\n        if self.command.snake or self.session.runtime_modifier.snake:\n            offset += prime2_snake_x_offset(\n                self._event_beat_distance(event),\n                geometry.note_size,\n            )\n\n        # Exceed's exact coefficient remains unrecovered. Keep its historical\n        # diagonal semantics isolated as an explicit approximation rather than\n        # folding it into Mirror, UA, or lane mapping.\n        if self.command.exceed_mode or self.session.runtime_modifier.exceed:\n            centre_lane = (self.columns - 1) / 2.0\n            if event.lane != centre_lane:\n                offset += legacy_exceed_x_offset(\n                    self._event_y(event) - self._receptor_y(),\n                    geometry.field_width,\n                    from_right=event.lane < centre_lane,\n                    travel_height=float(self.height()),\n                )\n        return offset\n\n    def _path_modifiers_active(self) -> bool:\n        return bool(\n            self.command.snake\n            or self.session.runtime_modifier.snake\n            or self.session.runtime_modifier.zigzag\n            or self.command.exceed_mode\n            or self.session.runtime_modifier.exceed\n            or self._effective_throw() is not ThrowMode.FLAT\n        )\n\n    def _screen_y_for_beat_distance(self, beat_distance: float) -> float:\n        geometry = self._geometry()\n        y = self._base_screen_y_for_beat_distance(beat_distance)\n        mode = self._effective_throw()\n        if mode is not ThrowMode.FLAT:\n            y += prime2_throw_y_offset(\n                beat_distance,\n                self.session.high_speed,\n                geometry.note_size,\n                rise=mode is ThrowMode.RISE,\n            )\n        return y\n\n    def _path_x_for_beat_distance(\n        self, beat_distance: float, lane: int, y: float, split_id: int | None = None\n    ) -> float:\n        geometry = self._geometry()\n        base_x = self.lane_center(lane)\n        if self.session.runtime_modifier.zigzag and split_id is not None:\n            visual_lane = self._visual_lane(lane)\n            lane_position = prime2_zigzag_lane_position(\n                visual_lane,\n                beat_distance,\n                self.columns,\n                self.stream.route.seed or 0,\n                start=self.stream.split_param(split_id, 222, 1.0),\n                interval=self.stream.split_param(split_id, 221, 1.0),\n            )\n            base_x = self._lane_position_x(lane_position)\n        offset = 0.0\n        if self.command.snake or self.session.runtime_modifier.snake:\n            offset += prime2_snake_x_offset(beat_distance, geometry.note_size)\n        if self.command.exceed_mode or self.session.runtime_modifier.exceed:\n            centre_lane = (self.columns - 1) / 2.0\n            if lane != centre_lane:\n                offset += legacy_exceed_x_offset(\n                    y - self._receptor_y(),\n                    geometry.field_width,\n                    from_right=lane < centre_lane,\n                    travel_height=float(self.height()),\n                )\n        return base_x + offset\n\n    def _event_opacity(self, event: PreviewEvent) -> float:\n        distance = abs(self._event_y(event) - self._receptor_y())\n        return self.command.note_opacity(\n            int(event.visibility),\n            distance=distance,\n            fade_distance=max(1.0, self.height() * 0.42),\n            time_ms=self._chart_time_ms,\n        )\n''',
              '''    def _event_x_offset(self, event: PreviewEvent) -> float:\n        geometry = self._geometry()\n        anchor, beat_distance = self._path_anchor(event)\n        offset = 0.0\n\n        if self.session.runtime_modifier.zigzag:\n            visual_lane = self._visual_lane(event.lane)\n            lane_position = prime2_zigzag_lane_position(\n                visual_lane,\n                beat_distance,\n                self.columns,\n                self.stream.route.seed or 0,\n                start=self.stream.block_param(anchor.block_id, 222, 1.0),\n                interval=self.stream.block_param(anchor.block_id, 221, 1.0),\n            )\n            offset += self._lane_position_x(lane_position) - self.lane_center(event.lane)\n\n        if self.command.snake or self.session.runtime_modifier.snake:\n            offset += prime2_snake_x_offset(beat_distance, geometry.note_size)\n\n        if self.command.exceed_mode or self.session.runtime_modifier.exceed:\n            anchor_y = self._base_screen_y_for_beat_distance(beat_distance)\n            if self.columns <= 5:\n                # A centred Single field still has one approach side per player:\n                # P1 enters from the right, P2 from the left. StartColumn >= 5 is\n                # the only chart-local P2 signal available to standalone preview.\n                from_right = self.start_column < 5\n            else:\n                centre_lane = (self.columns - 1) / 2.0\n                from_right = event.lane < centre_lane\n            offset += legacy_exceed_x_offset(\n                anchor_y - self._receptor_y(),\n                geometry.field_width,\n                from_right=from_right,\n                travel_height=float(self.height()),\n            )\n        return offset\n\n    def _screen_y_for_beat_distance(self, beat_distance: float) -> float:\n        return self._base_screen_y_for_beat_distance(beat_distance)\n\n    def _event_render_geometry(\n        self, event: PreviewEvent\n    ) -> tuple[float, float, float]:\n        centre_x = self.lane_center(event.lane) + self._event_x_offset(event)\n        centre_y = self._event_y(event)\n        _, beat_distance = self._path_anchor(event)\n        centre_x, centre_y, scale = self._throw_projection(\n            centre_x, centre_y, beat_distance\n        )\n        return centre_x, centre_y, self._geometry().note_size * scale\n\n    def _event_opacity(self, event: PreviewEvent) -> float:\n        _, local_y, _ = self._event_render_geometry(event)\n        _, sy, _, ty = self._sequence_affine()\n        screen_y = sy * local_y + ty\n        return self.command.note_opacity(\n            int(event.visibility),\n            screen_y=screen_y,\n            screen_midline=float(self.height()) / 2.0,\n            time_ms=self._chart_time_ms,\n        )\n''',
          )
          # Rigid legacy long-note geometry. Do not spline a hold through Snake,
          # Throw, Exceed or ZigZag. Head/tail share the head's path/depth state.
          start = Path(widget).read_text(encoding='utf-8').index('    def _draw_hold_shafts(')
          end = Path(widget).read_text(encoding='utf-8').index('    def _draw_sequence_zone(', start)
          text = Path(widget).read_text(encoding='utf-8')
          new_hold = '''    def _draw_hold_shafts(self, painter: QPainter, note_size: float) -> None:\n        for head, tail in self._hold_pairs:\n            if tail.time_ms < self._chart_time_ms - 80.0:\n                continue\n\n            y1 = self._event_y(head)\n            y2 = self._event_y(tail)\n            if head.time_ms <= self._chart_time_ms <= tail.time_ms:\n                y1 = self._receptor_y()\n            anchor_x = self.lane_center(head.lane) + self._event_x_offset(head)\n            _, anchor_distance = self._path_anchor(head)\n            x1, y1, scale = self._throw_projection(anchor_x, y1, anchor_distance)\n            x2, y2, _ = self._throw_projection(anchor_x, y2, anchor_distance)\n            centre = (x1 + x2) / 2.0\n            rendered_note_size = note_size * scale\n            if max(y1, y2) < -100 or min(y1, y2) > self.height() + 100:\n                continue\n            target = QRectF(\n                centre - rendered_note_size / 2,\n                min(y1, y2),\n                rendered_note_size,\n                max(2.0, abs(y2 - y1)),\n            )\n            bank = (\n                None\n                if self._noteskin_pack is None\n                else self._noteskin_pack.bank(head.raw[2])\n            )\n            drawn = False\n            painter.save()\n            painter.setOpacity(self._event_opacity(head))\n            if bank is not None:\n                frame = int(max(0.0, self._chart_time_ms) // 80) % len(\n                    bank.animation\n                )\n                atlas = bank.animation[frame]\n                pixmap = self._pixmap(atlas)\n                if pixmap is not None:\n                    atlas_lane = (\n                        self.start_column + self._visual_lane(head.lane)\n                    ) % 5\n                    tile_x, tile_y, tile_width, _ = atlas.tile(atlas_lane, 0)\n                    painter.drawPixmap(\n                        target,\n                        pixmap,\n                        QRectF(tile_x, tile_y, tile_width, 8),\n                    )\n                    drawn = True\n            if not drawn:\n                width = max(8.0, rendered_note_size * 0.34)\n                painter.fillRect(\n                    QRectF(\n                        centre - width / 2,\n                        min(y1, y2),\n                        width,\n                        max(2.0, abs(y2 - y1)),\n                    ),\n                    QColor(88, 160, 230, 210),\n                )\n            painter.restore()\n\n'''
          Path(widget).write_text(text[:start] + new_hold + text[end:], encoding='utf-8')

          replace_once(
              widget,
              '''            centre_x = self.lane_center(note.lane) + self._event_x_offset(note)\n            centre_y = self._event_y(note)\n            rect = QRectF(\n                centre_x - note_size / 2,\n                centre_y - note_size / 2,\n                note_size,\n                note_size,\n            )\n''',
              '''            centre_x, centre_y, rendered_note_size = self._event_render_geometry(note)\n            rect = QRectF(\n                centre_x - rendered_note_size / 2,\n                centre_y - rendered_note_size / 2,\n                rendered_note_size,\n                rendered_note_size,\n            )\n''',
          )

          # Public exports for the corrected Prime camera/depth helpers.
          init = 'src/stepnx/preview/__init__.py'
          replace_once(
              init,
              '''    PRIME2_THROW_ALT_AMPLITUDE,\n    PRIME2_THROW_AMPLITUDE,\n    PRIME2_THROW_SPAN,\n''',
              '''    PRIME2_THROW_ALT_AMPLITUDE,\n    PRIME2_THROW_AMPLITUDE,\n    PRIME2_THROW_CAMERA_EYE_Z,\n    PRIME2_THROW_CAMERA_FOV,\n    PRIME2_THROW_SPAN,\n''',
          )
          replace_once(
              init,
              '''    prime2_snake_x_offset,\n    prime2_throw_y_offset,\n    prime2_zigzag_keyframes,\n''',
              '''    prime2_snake_x_offset,\n    prime2_throw_perspective_scale,\n    prime2_throw_y_offset,\n    prime2_throw_z_offset,\n    prime2_zigzag_keyframes,\n''',
          )
          replace_once(
              init,
              '''    \"PRIME2_THROW_ALT_AMPLITUDE\",\n    \"PRIME2_THROW_AMPLITUDE\",\n    \"PRIME2_THROW_SPAN\",\n''',
              '''    \"PRIME2_THROW_ALT_AMPLITUDE\",\n    \"PRIME2_THROW_AMPLITUDE\",\n    \"PRIME2_THROW_CAMERA_EYE_Z\",\n    \"PRIME2_THROW_CAMERA_FOV\",\n    \"PRIME2_THROW_SPAN\",\n''',
          )
          replace_once(
              init,
              '''    \"prime2_snake_x_offset\",\n    \"prime2_throw_y_offset\",\n    \"prime2_zigzag_keyframes\",\n''',
              '''    \"prime2_snake_x_offset\",\n    \"prime2_throw_perspective_scale\",\n    \"prime2_throw_y_offset\",\n    \"prime2_throw_z_offset\",\n    \"prime2_zigzag_keyframes\",\n''',
          )

          # Regression updates: 221/222 at Block level, real Z projection, centre
          # display gate, and centred Single Exceed direction.
          tests = 'tests/unit/test_rise_visual_modifiers.py'
          replace_once(
              tests,
              '''    PRIME2_THROW_AMPLITUDE,\n    PRIME2_THROW_SPAN,\n''',
              '''    PRIME2_THROW_AMPLITUDE,\n    PRIME2_THROW_CAMERA_EYE_Z,\n    PRIME2_THROW_SPAN,\n''',
          )
          replace_once(
              tests,
              '''    prime2_throw_y_offset,\n    prime2_zigzag_keyframes,\n''',
