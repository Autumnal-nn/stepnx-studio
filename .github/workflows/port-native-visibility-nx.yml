ect_point(\n            320.0, 240.0, 640.0, 480.0, z=100.0\n        )\n        depth_drop = legacy_nx_project_point(\n            320.0, 240.0, 640.0, 480.0, z=100.0, drop=True\n        )\n        self.assertNotAlmostEqual(depth_normal[1], depth_drop[1])\n''',
