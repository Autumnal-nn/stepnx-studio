name: Port native visibility mask and NX projection

on:
  push:
    branches:
      - audit/rise-visual-command-re

permissions:
  contents: write

jobs:
  port:
    if: github.event.head_commit.message == 'Run native visibility NX port'
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/rise-visual-command-re
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct and run port script
        run: |
          python - <<'PY'
          from pathlib import Path

          template = Path('.github/scripts/port-native-visibility-nx.template').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = template.index(marker) + len(marker)
          end = template.index("\n          PY\n", start)
          lines = template[start:end].splitlines()
          output = []
          in_module_literal = False
          for line in lines:
              if not in_module_literal:
                  if line.startswith('          '):
                      line = line[10:]
                  if "Path('src/stepnx/preview/legacy_render.py').write_text(r'''" in line:
                      in_module_literal = True
              else:
                  if line == "''', encoding='utf-8')":
                      in_module_literal = False
              output.append(line)
          Path('/tmp/port_native_visibility_nx.py').write_text(
              '\n'.join(output) + '\n', encoding='utf-8'
          )
          PY
          python /tmp/port_native_visibility_nx.py
      - name: Install Linux Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libopengl0 libpulse0 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0
      - name: Install StepNX Studio with GUI dependencies
        run: python -m pip install -e '.[gui]'
      - name: Run complete repository suite
        run: python -m unittest discover -s tests -v
      - name: Commit verified port
        run: |
          git config user.name 'OpenAI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/port-native-visibility-nx.yml
          git rm .github/scripts/port-native-visibility-nx.template
          git add src/stepnx/preview/legacy_render.py \
                  src/stepnx/preview/commands.py \
                  src/stepnx/preview/visuals.py \
                  src/stepnx/gui/preview_widget.py \
                  tests/unit/test_rise_visual_modifiers.py \
                  tests/unit/test_preview.py \
                  tests/unit/test_qt_preview.py \
                  docs/PRIME2_PATH_MODIFIER_AUDIT.md
          git diff --cached --check
          git commit -m 'Port native visibility mask and NX Mode rendering'
          git push origin HEAD:audit/rise-visual-command-re
