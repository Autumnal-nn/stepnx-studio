name: Fix native Prime playfield geometry

on:
  push:
    branches:
      - audit/rise-visual-command-re

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Run native playfield geometry fix'
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/rise-visual-command-re
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply native playfield geometry patch
        run: python .github/scripts/fix-native-playfield-geometry.py
      - name: Install Linux Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libopengl0 libpulse0 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0
      - name: Install StepNX Studio with GUI dependencies
        run: python -m pip install -e '.[gui]'
      - name: Run complete repository suite
        run: python -m unittest discover -s tests -v
      - name: Commit verified geometry fix
        run: |
          git config user.name 'OpenAI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/scripts/fix-native-playfield-geometry.py
          git rm .github/workflows/fix-native-playfield-geometry.yml
          git add src tests docs
          git commit -m 'Implement native Prime playfield geometry'
          git push origin HEAD:audit/rise-visual-command-re
