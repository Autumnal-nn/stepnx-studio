name: Release StepNX Studio 0.9.1

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  RELEASE_TAG: StepNX-Studio-0.9.1
  RELEASE_VERSION: 0.9.1

jobs:
  windows:
    if: startsWith(github.event.head_commit.message, 'Release StepNX Studio 0.9.1')
    runs-on: windows-latest
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install release dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui,build]"
          python -c "import importlib.metadata as m; assert m.version('stepnx-studio') == '${{ env.RELEASE_VERSION }}'"

      - name: Run strict Windows gate
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python tools/run_windows_test_gate.py

      - name: Build Windows bundle
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File tools\build_windows_package.ps1 -Python python -SkipInstall -SkipTests
          New-Item -ItemType Directory -Force release | Out-Null
          Move-Item dist\StepNX-Studio-Windows.zip release\StepNX-Studio-0.9.1-Windows-x86_64.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: StepNX-Studio-0.9.1-Windows-x86_64
          path: release/StepNX-Studio-0.9.1-Windows-x86_64.zip
          if-no-files-found: error

  linux:
    if: startsWith(github.event.head_commit.message, 'Release StepNX Studio 0.9.1')
    runs-on: ubuntu-22.04
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4

      - name: Build and test on glibc 2.31 baseline
        run: |
          docker run --rm \
            -e DEBIAN_FRONTEND=noninteractive \
            -e QT_QPA_PLATFORM=offscreen \
            -e RELEASE_VERSION="${RELEASE_VERSION}" \
            -v "$PWD:/work" \
            -w /work \
            python:3.11-bullseye \
            bash -lc '
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends \
                libasound2 \
                libegl1 \
                libgl1 \
                libpulse0 \
                libxcb-cursor0 \
                libxcb-icccm4 \
                libxcb-image0 \
                libxcb-keysyms1 \
                libxcb-render-util0 \
                libxcb-xinerama0 \
                libxkbcommon-x11-0
              python -m pip install --upgrade pip
              python -m pip install -e ".[gui,build]"
              python -c "import importlib.metadata as m, os; assert m.version(\"stepnx-studio\") == os.environ[\"RELEASE_VERSION\"]"
              python -m unittest discover -s tests -v
              python -m PyInstaller --noconfirm --clean packaging/stepnx-studio.spec
              test -x dist/StepNX-Studio-Windows/StepNX-Studio
              mv dist/StepNX-Studio-Windows dist/StepNX-Studio-Linux-x86_64
              mkdir -p release
              tar -C dist -czf release/StepNX-Studio-0.9.1-Linux-x86_64.tar.gz StepNX-Studio-Linux-x86_64
            '

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: StepNX-Studio-0.9.1-Linux-x86_64
          path: release/StepNX-Studio-0.9.1-Linux-x86_64.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.event.head_commit.message, 'Release StepNX Studio 0.9.1')
    needs:
      - windows
      - linux
    runs-on: ubuntu-latest
    steps:
      - name: Check out release notes
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum \
            StepNX-Studio-0.9.1-Windows-x86_64.zip \
            StepNX-Studio-0.9.1-Linux-x86_64.tar.gz \
            > SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --title "StepNX Studio 0.9.1" --notes-file docs/RELEASE_NOTES_0.9.1.md
          else
            gh release create "$RELEASE_TAG" release-assets/* --target "$GITHUB_SHA" --title "StepNX Studio 0.9.1" --notes-file docs/RELEASE_NOTES_0.9.1.md
          fi
