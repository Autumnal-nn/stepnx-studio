name: Fix Snake Path and mission IDs

on:
  push:
    branches:
      - audit/rise-visual-command-re

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Fix Snake Path and mission IDs'
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/rise-visual-command-re
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch Snake Path and Inspector semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected fragment not found in {path}: {old[:180]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          # --- Preview event semantic bit -----------------------------------
          replace_once(
              'src/stepnx/preview/events.py',
              '''    @property\n    def visual_effect(self) -> int:\n        return self.raw[1]\n\n    @property\n    def bank_param(self) -> int:\n''',
              '''    @property\n    def visual_effect(self) -> int:\n        return self.raw[1]\n\n    @property\n    def snake_path(self) -> bool:\n        """NX20 per-note Snake Path flag (VisualEffect bit 0x10)."""\n        return bool(self.visual_effect & 0x10)\n\n    @property\n    def bank_param(self) -> int:\n''',
          )

          # --- Correct the semantic name of the recovered per-note path -----
          replace_once(
              'src/stepnx/preview/visuals.py',
              '''def prime2_zigzag_lane_position(\n''',
              '''def prime2_snake_path_lane_position(\n''',
          )
          replace_once(
              'src/stepnx/preview/visuals.py',
              '''    """Port Prime 1's path_zigzag lane interpolation consumer.\n\n    Before Div 222's start value the lane is unchanged. Afterwards the renderer\n    interpolates between nine permutation maps at the Div 221 interval and\n    clamps phase >= 8 to keyframe eight.\n    """\n''',
              '''    """Port the legacy NX20 per-note Snake Path interpolation.\n\n    VisualEffect bit 0x10 selects this path independently of Header 34's global\n    Snake modifier. Div 222 is the straight-zone/start threshold and Div 221 is\n    the phase length/divisor. After the threshold the renderer interpolates\n    between nine pseudo-random lane maps and clamps phase >= 8 to keyframe eight.\n    """\n''',
          )
          replace_once(
              'src/stepnx/preview/visuals.py',
              '''\ndef legacy_exceed_x_offset(\n''',
              '''\n# Compatibility alias for code written during the audit before the recovered\n# path was correctly separated from Header 35 ZigZag. New code must use the\n# Snake Path name; 221/222 do not describe Header 35.\nprime2_zigzag_lane_position = prime2_snake_path_lane_position\n\n\ndef legacy_exceed_x_offset(\n''',
          )

          # Export the corrected semantic helper while keeping the old alias.
          replace_once(
              'src/stepnx/preview/__init__.py',
              '''    prime2_snake_x_offset,\n    prime2_throw_perspective_scale,\n''',
              '''    prime2_snake_path_lane_position,\n    prime2_snake_x_offset,\n    prime2_throw_perspective_scale,\n''',
          )
          replace_once(
              'src/stepnx/preview/__init__.py',
              '''    "prime2_snake_x_offset",\n    "prime2_throw_perspective_scale",\n''',
              '''    "prime2_snake_path_lane_position",\n    "prime2_snake_x_offset",\n    "prime2_throw_perspective_scale",\n''',
          )

          # --- Wire VisualEffect 0x10 + block Div 221/222 ------------------
          replace_once(
              'src/stepnx/gui/preview_widget.py',
              '''    prime2_snake_x_offset,\n    prime2_throw_perspective_scale,\n    prime2_throw_z_offset,\n    prime2_zigzag_lane_position,\n''',
              '''    prime2_snake_path_lane_position,\n    prime2_snake_x_offset,\n    prime2_throw_perspective_scale,\n    prime2_throw_z_offset,\n''',
          )
          replace_once(
              'src/stepnx/gui/preview_widget.py',
              '''        anchor, beat_distance = self._path_anchor(event)\n        offset = 0.0\n\n        if self.session.runtime_modifier.zigzag:\n            visual_lane = self._visual_lane(event.lane)\n            lane_position = prime2_zigzag_lane_position(\n                visual_lane,\n                beat_distance,\n                self.columns,\n                self.stream.route.seed or 0,\n                start=self.stream.block_param(anchor.block_id, 222, 1.0),\n                interval=self.stream.block_param(anchor.block_id, 221, 1.0),\n            )\n            offset += self._lane_position_x(lane_position) - self.lane_center(event.lane)\n\n        if self.command.snake or self.session.runtime_modifier.snake:\n''',
              '''        _, beat_distance = self._path_anchor(event)\n        offset = 0.0\n\n        # NX20 Snake Path is a per-note VisualEffect bit. It is not Header 35\n        # ZigZag and it is not Header 34 / COMMAND z global Snake. The selected\n        # block supplies its phase start (222) and phase length (221).\n        if event.snake_path:\n            visual_lane = self._visual_lane(event.lane)\n            lane_position = prime2_snake_path_lane_position(\n                visual_lane,\n                beat_distance,\n                self.columns,\n                self.stream.route.seed or 0,\n                start=self.stream.block_param(event.block_id, 222, 1.0),\n                interval=self.stream.block_param(event.block_id, 221, 1.0),\n            )\n            offset += self._lane_position_x(lane_position) - self.lane_center(event.lane)\n\n        # Header 35 ZigZag remains effective state only until its distinct\n        # rendering equation is recovered. Do not alias it to Snake Path.\n        if self.command.snake or self.session.runtime_modifier.snake:\n''',
          )

          # --- Mission text metadata IDs in Inspector ----------------------
          replace_once(
              'src/stepnx/core/profiles.py',
              '''    return None\n\n\ndef authorable_metadata(\n''',
              '''    return None\n\n\ndef metadata_display_id(\n    profile_name: str,\n    scope: MetadataScope,\n    meta_id: int,\n) -> str:\n    """Return the human-facing metadata ID without changing serialized bits.\n\n    Later mission text IDs pack the localization slot in the high word and the\n    semantic field in the low word. The inspector should therefore show the\n    runtime addressing form (for example 0/1103, 1/1103, 2/1103) instead of the\n    opaque decimal composites 1103, 66639, 132175. Other IDs stay unchanged.\n    """\n\n    raw_id = int(meta_id)\n    definition = metadata_definition(profile_name, scope, raw_id)\n    base_id = raw_id & 0xFFFF\n    if (\n        scope is MetadataScope.HEADER\n        and definition is not None\n        and definition.kind is ValueKind.TRAILER_OFFSET\n        and base_id in (1103, 1203, 1303, 1403)\n    ):\n        return f"{raw_id >> 16}/{base_id}"\n    return str(raw_id)\n\n\ndef authorable_metadata(\n''',
          )
          replace_once(
              'src/stepnx/gui/app.py',
              '''    from stepnx.core.profiles import MetadataScope, metadata_definition\n''',
              '''    from stepnx.core.profiles import (\n        MetadataScope,\n        metadata_definition,\n        metadata_display_id,\n    )\n''',
          )
          replace_once(
              'src/stepnx/gui/app.py',
              '''                    yield (f"{label} — {name}", str(meta_id), value, entry.value.hex)\n''',
              '''                    yield (\n                        f"{label} — {name}",\n                        metadata_display_id(document.profile, scope, meta_id),\n                        value,\n                        entry.value.hex,\n                    )\n''',
          )

          # --- Tests: remove the incorrect Header35/221/222 association -----
          rise_tests = 'tests/unit/test_rise_visual_modifiers.py'
          replace_once(
              rise_tests,
              '''    prime2_snake_x_offset,\n    prime2_throw_perspective_scale,\n''',
              '''    prime2_snake_path_lane_position,\n    prime2_snake_x_offset,\n    prime2_throw_perspective_scale,\n''',
          )
          text = Path(rise_tests).read_text(encoding='utf-8')
          text = text.replace(
              'test_prime_zigzag_uses_nine_permutation_keyframes_and_div_phase',
              'test_prime_snake_path_uses_nine_permutation_keyframes_and_div_phase',
          )
          text = text.replace(
              'test_runtime_stream_preserves_block_221_222_for_zigzag',
              'test_runtime_stream_preserves_block_221_222_for_snake_path',
          )
          text = text.replace('prime2_zigzag_lane_position(', 'prime2_snake_path_lane_position(')
          text = text.replace('    prime2_zigzag_lane_position,\n', '')
          Path(rise_tests).write_text(text, encoding='utf-8')
          replace_once(
              rise_tests,
              '''                self.assertEqual(event.visual_effect & 0x10, 0x10)\n''',
              '''                self.assertEqual(event.visual_effect & 0x10, 0x10)\n                self.assertTrue(event.snake_path)\n''',
          )

          # Qt integration: a headerless note with VE 0x10 must consume its own\n          # block's 221/222 and move, while an otherwise identical note does not.
          qt_tests = 'tests/unit/test_qt_preview.py'
          replace_once(
              qt_tests,
              '''        RoutePolicy,\n        SequenceZoneTransform,\n''',
              '''        RoutePolicy,\n        SequenceZoneTransform,\n        StepParam,\n''',
          )
          marker = '''    def test_lane_geometry_centres_assets_on_native_sequence_zone_anchors(self) -> None:\n'''
          insertion = '''    def test_visual_effect_snake_path_reads_block_221_222_without_header_snake(self) -> None:\n        widget = self._widget()\n        try:\n            widget.resize(640, 480)\n            base = widget.stream.events[0]\n            widget.stream = replace(\n                widget.stream,\n                block_step_params=((\n                    base.block_id,\n                    (StepParam(221, 2), StepParam(222, 3)),\n                ),),\n            )\n            current_position = widget.stream.position_at(widget.chart_time_ms)\n            plain = replace(\n                base,\n                lane=0,\n                raw=b"\\x03\\x03\\x00\\x00",\n                native_block_index=-1,\n                position=current_position + 4.0,\n            )\n            snake = replace(plain, raw=b"\\x03\\x13\\x00\\x00")\n\n            self.assertFalse(plain.snake_path)\n            self.assertTrue(snake.snake_path)\n            self.assertEqual(widget._event_x_offset(plain), 0.0)\n\n            expected_lane = prime2_snake_path_lane_position(\n                0,\n                4.0,\n                widget.columns,\n                widget.stream.route.seed or 0,\n                start=3.0,\n                interval=2.0,\n            )\n            expected = (\n                widget._lane_position_x(expected_lane) - widget.lane_center(0)\n            )\n            self.assertNotEqual(expected, 0.0)\n            self.assertAlmostEqual(widget._event_x_offset(snake), expected)\n        finally:\n            widget.close()\n\n'''
          replace_once(qt_tests, marker, insertion + marker)
          replace_once(
              qt_tests,
              '''        parse_gameplay_command,\n        resolve_route,\n''',
              '''        parse_gameplay_command,\n        prime2_snake_path_lane_position,\n        resolve_route,\n''',
          )

          # Inspector ID formatting gets a pure regression test as well.
          profile_tests = 'tests/unit/test_profile_semantics.py'
          replace_once(
              profile_tests,
              '''    metadata_definition,\n    metadata_variant_label,\n''',
              '''    metadata_definition,\n    metadata_display_id,\n    metadata_variant_label,\n''',
          )
          replace_once(
              profile_tests,
              '''        self.assertIsNone(metadata_variant_label(1103))\n''',
              '''        self.assertIsNone(metadata_variant_label(1103))\n        self.assertEqual(\n            metadata_display_id("fiesta2", MetadataScope.HEADER, 1103),\n            "0/1103",\n        )\n        self.assertEqual(\n            metadata_display_id("fiesta2", MetadataScope.HEADER, 66639),\n            "1/1103",\n        )\n        self.assertEqual(\n            metadata_display_id("fiesta2", MetadataScope.HEADER, 132175),\n            "2/1103",\n        )\n        self.assertEqual(\n            metadata_display_id("fiesta2", MetadataScope.HEADER, 1150),\n            "1150",\n        )\n''',
          )
          PY
      - name: Install Linux Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libopengl0 \
            libpulse0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-xinerama0
      - name: Install StepNX Studio with GUI dependencies
        run: python -m pip install -e '.[gui]'
      - name: Run complete repository suite
        run: python -m unittest discover -s tests -v
      - name: Commit verified corrections
        run: |
          git config user.name 'OpenAI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-snake-path-mission-inspector.yml
          git add src/stepnx/preview/events.py \
                  src/stepnx/preview/visuals.py \
                  src/stepnx/preview/__init__.py \
                  src/stepnx/gui/preview_widget.py \
                  src/stepnx/core/profiles.py \
                  src/stepnx/gui/app.py \
                  tests/unit/test_rise_visual_modifiers.py \
                  tests/unit/test_qt_preview.py \
                  tests/unit/test_profile_semantics.py
          git diff --cached --check
          git commit -m 'Correct per-note Snake Path and mission IDs'
          git push origin HEAD:audit/rise-visual-command-re
