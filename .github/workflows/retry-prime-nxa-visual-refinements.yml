name: Retry Prime/NXA visual refinements

on:
  push:
    branches:
      - audit/rise-visual-command-re

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Retry Prime/NXA visual refinement workflow'
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/rise-visual-command-re
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reapply recovered patch with float-faithful regression
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-prime-nxa-visual-refinements.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          patch_script = textwrap.dedent(workflow[start:end])
          exec(compile(patch_script, '<prime-nxa-patch>', 'exec'))

          test_path = Path('tests/unit/test_rise_visual_modifiers.py')
          text = test_path.read_text(encoding='utf-8')
          old = '''        self.assertAlmostEqual(\n            legacy_acc_dec_distance(0.0, 1.0, 60.0, AccDecMode.ACCELERATION),\n            0.0,\n            places=5,\n        )\n'''
          new = '''        self.assertAlmostEqual(\n            legacy_acc_dec_distance(0.0, 1.0, 60.0, AccDecMode.ACCELERATION),\n            600.0 - 50000.0 / 83.33333587646484,\n            places=10,\n        )\n'''
          if old not in text:
              raise SystemExit('float-faithful Acceleration regression target not found')
          test_path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Install Linux Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libopengl0 \
            libpulse0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-xinerama0
      - name: Install StepNX Studio with GUI dependencies
        run: python -m pip install -e '.[gui]'
      - name: Run complete repository suite
        run: python -m unittest discover -s tests -v
      - name: Commit refinement and remove one-shot workflows
        run: |
          git config user.name 'OpenAI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-prime-nxa-visual-refinements.yml \
                 .github/workflows/retry-prime-nxa-visual-refinements.yml
          git add src/stepnx/preview/visuals.py \
                  src/stepnx/preview/events.py \
                  src/stepnx/preview/commands.py \
                  src/stepnx/preview/__init__.py \
                  src/stepnx/gui/preview_widget.py \
                  src/stepnx/gui/preview_dialog.py \
                  tests/unit/test_preview.py \
                  tests/unit/test_rise_visual_modifiers.py \
                  tests/unit/test_qt_preview.py
          git diff --cached --check
          git commit -m 'Refine legacy visual modifiers from Prime and NXA'
          git push origin HEAD:audit/rise-visual-command-re
