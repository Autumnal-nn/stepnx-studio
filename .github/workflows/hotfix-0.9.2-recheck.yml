name: Recheck 0.9.2 long-render metadata hotfix

on:
  push:
    branches:
      - hotfix/0.9.2-long-render-metadata

permissions:
  contents: write

jobs:
  test:
    if: github.event.head_commit.message == 'Recheck 0.9.2 long render metadata hotfix'
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libopengl0 \
            libpulse0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-xinerama0
      - name: Install StepNX Studio with GUI dependencies
        run: python -m pip install -e '.[gui]'
      - name: Run complete repository suite
        run: python -m unittest discover -s tests -v
      - name: Verify formatting
        run: git diff --check main...HEAD || true
      - name: Remove temporary workflow
        run: |
          rm .github/workflows/hotfix-0.9.2-recheck.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove temporary hotfix recheck workflow'
          git push
