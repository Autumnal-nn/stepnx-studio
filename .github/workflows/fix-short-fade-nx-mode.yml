name: Fix short visibility fade and NX Mode option

on:
  push:
    branches:
      - audit/rise-visual-command-re

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Install short visibility fade and NX Mode option'
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/rise-visual-command-re
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply locked Snake / short fade / NX Mode patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected fragment not found in {path}: {old[:180]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Restore the historical ^ / NX Mode selector as a distinct COMMAND.
          # Its consumer is not inferred here: expose and serialize it, but keep
          # unproven rendering behavior explicitly pending.
          replace_once(
              'src/stepnx/preview/commands.py',
              '    CommandFlag("x", "exceed_mode", "Exceed"),\n    CommandFlag("(", "sink", "Sink"),\n',
              '    CommandFlag("x", "exceed_mode", "Exceed"),\n    CommandFlag("^", "nx_mode", "NX Mode"),\n    CommandFlag("(", "sink", "Sink"),\n',
          )
          replace_once(
              'src/stepnx/preview/commands.py',
              '    exceed_mode: bool = False\n    sink: bool = False\n',
              '    exceed_mode: bool = False\n    nx_mode: bool = False\n    sink: bool = False\n',
          )
          replace_once(
              'src/stepnx/preview/commands.py',
              '''    def pending_effects(self) -> tuple[str, ...]:\n        """Return parsed flags that still have no complete runtime projection."""\n\n        return ()\n''',
              '''    def pending_effects(self) -> tuple[str, ...]:\n        """Return parsed flags that still have no complete runtime projection."""\n\n        return ("^",) if self.nx_mode else ()\n''',
          )

          # FFF11 capture shows a compact visibility transition near the judge
          # line. Scale it by rendered note size, not by 42% of viewport height.
          replace_once(
              'src/stepnx/gui/preview_widget.py',
              '''    def _event_opacity(self, event: PreviewEvent) -> float:\n        _, local_y, _ = self._event_render_geometry(event)\n''',
              '''    def _visibility_fade_distance(self) -> float:\n        # Legacy Appear/Vanish is a local transition around the receptor.\n        # FFF11 capture is consistent with roughly one-and-a-half rendered\n        # note widths, not the former viewport-height ramp.\n        return max(1.0, self._geometry().note_size * 1.5)\n\n    def _event_opacity(self, event: PreviewEvent) -> float:\n        _, local_y, _ = self._event_render_geometry(event)\n''',
          )
          replace_once(
              'src/stepnx/gui/preview_widget.py',
              '            fade_distance=max(1.0, float(self.height()) * 0.42),\n',
              '            fade_distance=self._visibility_fade_distance(),\n',
          )

          # Registry and parser regressions for the restored NX Mode selector.
          replace_once(
              'tests/unit/test_rise_visual_modifiers.py',
              '        self.assertEqual(len(COMMAND_FLAGS), 18)\n',
              '        self.assertEqual(len(COMMAND_FLAGS), 19)\n',
          )
          replace_once(
              'tests/unit/test_rise_visual_modifiers.py',
              '''                "x",\n                "(",\n''',
              '''                "x",\n                "^",\n                "(",\n''',
          )
          replace_once(
              'tests/unit/test_rise_visual_modifiers.py',
              '''        self.assertEqual(serialize_command_flags(("!", "u")), "u!")\n        with self.assertRaisesRegex(ValueError, "unsupported COMMAND"):\n''',
              '''        self.assertEqual(serialize_command_flags(("!", "u")), "u!")\n        self.assertEqual(serialize_command_flags(("^", "x")), "x^")\n        nx = parse_gameplay_command("x^")\n        self.assertTrue(nx.exceed_mode)\n        self.assertTrue(nx.nx_mode)\n        self.assertEqual(nx.pending_effects, ("^",))\n        with self.assertRaisesRegex(ValueError, "unsupported COMMAND"):\n''',
          )

          replace_once(
              'tests/unit/test_preview.py',
              '        command = parse_gameplay_command("vadenswfjx")\n        self.assertEqual(command.approximate_effects, ("V", "X"))\n        self.assertEqual(command.pending_effects, ())\n',
              '        command = parse_gameplay_command("vadenswfjx^")\n        self.assertEqual(command.approximate_effects, ("V", "X"))\n        self.assertEqual(command.pending_effects, ("^",))\n',
          )

          # UI regression: ^ must be visible as semantic NX Mode and serialized.
          replace_once(
              'tests/unit/test_qt_preview.py',
              '''            self.assertEqual(\n                tuple(dialog.command_list.item(i).text() for i in range(dialog.command_list.count())),\n                tuple(flag.label for flag in COMMAND_FLAGS),\n            )\n\n            dialog.chart_combo.setCurrentText("S17.NX")\n''',
              '''            self.assertEqual(\n                tuple(dialog.command_list.item(i).text() for i in range(dialog.command_list.count())),\n                tuple(flag.label for flag in COMMAND_FLAGS),\n            )\n            self.assertEqual(dialog.command_items["^"].text(), "NX Mode")\n\n            dialog.chart_combo.setCurrentText("S17.NX")\n''',
          )
          replace_once(
              'tests/unit/test_qt_preview.py',
              '''            dialog.command_items["v"].setCheckState(Qt.CheckState.Checked)\n            dialog.command_items["m"].setCheckState(Qt.CheckState.Checked)\n            options = dialog.options()\n            self.assertEqual(options.document_index, 2)\n            self.assertEqual(options.speed, 8)\n            self.assertEqual(options.command, "vm")\n''',
              '''            dialog.command_items["v"].setCheckState(Qt.CheckState.Checked)\n            dialog.command_items["m"].setCheckState(Qt.CheckState.Checked)\n            dialog.command_items["^"].setCheckState(Qt.CheckState.Checked)\n            options = dialog.options()\n            self.assertEqual(options.document_index, 2)\n            self.assertEqual(options.speed, 8)\n            self.assertEqual(options.command, "vm^")\n''',
          )

          # Lock the visually validated 221/222 behavior: do not modify its code.
          # Add a fade-scale regression on the widget instead.
          marker = '''    def test_event_culling_uses_chart_time_without_mutating_stream(self) -> None:\n'''
          insertion = '''    def test_legacy_visibility_fade_is_local_to_note_scale(self) -> None:\n        widget = self._widget("v")\n        try:\n            widget.resize(640, 480)\n            self.assertAlmostEqual(\n                widget._visibility_fade_distance(),\n                widget._geometry().note_size * 1.5,\n            )\n            self.assertLess(widget._visibility_fade_distance(), widget.height() * 0.25)\n        finally:\n            widget.close()\n\n'''
          replace_once('tests/unit/test_qt_preview.py', marker, insertion + marker)

          # Record the validated boundary and the deliberately unresolved NX consumer.
          audit = Path('docs/PRIME2_PATH_MODIFIER_AUDIT.md')
          text = audit.read_text(encoding='utf-8')
          append = '''\n## Visual validation follow-up\n\n- NX20 Snake Path `221/222` boundary convergence was visually validated against legacy gameplay on 2026-08-29. The phase-zero identity convergence is locked; later preview work must not replace it without contradictory runtime/capture evidence.\n- Legacy Appear/Vanish remains a continuous fade, but its spatial window is compact around the judge line. StepNX now scales that window to `1.5 * rendered note size` instead of viewport height; the exact legacy easing curve remains approximate.\n- PIUTESTER/NX2 compatibility command `^` is restored to the selector as **NX Mode**. It is distinct from `x` / Exceed. No visual consumer is invented until source evidence establishes its rendering behavior.\n'''
          if '## Visual validation follow-up' not in text:
              audit.write_text(text.rstrip() + '\n' + append, encoding='utf-8')
          PY
      - name: Install Linux Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libopengl0 libpulse0 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0
      - name: Install StepNX Studio with GUI dependencies
        run: python -m pip install -e '.[gui]'
      - name: Run complete repository suite
        run: python -m unittest discover -s tests -v
      - name: Commit verified corrections
        run: |
          git config user.name 'OpenAI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-short-fade-nx-mode.yml
          git add src/stepnx/preview/commands.py \
                  src/stepnx/gui/preview_widget.py \
                  tests/unit/test_rise_visual_modifiers.py \
                  tests/unit/test_preview.py \
                  tests/unit/test_qt_preview.py \
                  docs/PRIME2_PATH_MODIFIER_AUDIT.md
          git diff --cached --check
          git commit -m 'Shorten visibility fade and restore NX Mode option'
          git push origin HEAD:audit/rise-visual-command-re
