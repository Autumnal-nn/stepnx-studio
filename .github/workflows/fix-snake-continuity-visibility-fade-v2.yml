name: Fix Snake continuity and visibility fade v2

on:
  push:
    branches:
      - audit/rise-visual-command-re

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Install Snake continuity and fade correction v2'
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/rise-visual-command-re
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply capture-driven visual corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected fragment not found in {path}: {old[:160]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          def regex_once(path: str, pattern: str, replacement: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'expected one regex match in {path}, got {count}')
              file.write_text(updated, encoding='utf-8')

          # Snake Path continuity: keyframe zero is the authored/identity map.
          # This preserves the recovered phase formula while making phase -> 0
          # converge naturally into the correct receptor lane at Div 222.
          replace_once(
              'src/stepnx/preview/visuals.py',
              '''    state = int(seed) & 0xFFFFFFFF\n    frames: list[tuple[int, ...]] = []\n    for _ in range(PRIME2_ZIGZAG_KEYFRAME_COUNT):\n        candidates = list(range(count))\n        output = [0] * count\n''',
              '''    state = int(seed) & 0xFFFFFFFF\n    # Phase zero is the authored lane map. The previous implementation\n    # randomized frame zero as well, which caused an observable snap when the\n    # path crossed Div 222 into its straight zone.\n    frames: list[tuple[int, ...]] = [tuple(range(count))]\n    for _ in range(1, PRIME2_ZIGZAG_KEYFRAME_COUNT):\n        candidates = list(range(count))\n        output = [0] * count\n''',
          )
          replace_once(
              'src/stepnx/preview/visuals.py',
              '''    """Build Prime 1's nine deterministic ZigZag permutation keyframes.\n\n    The native seed also includes an engine-owned per-player contribution that\n''',
              '''    """Build the nine deterministic legacy Snake Path keyframes.\n\n    Keyframe zero is identity so phase zero joins the authored lane continuously\n    at Div 222. Keyframes one through eight use the recovered permutation\n    generator. The native seed also includes an engine-owned per-player contribution that\n''',
          )

          # Restore continuous alpha ramps for per-note and COMMAND Appear/Vanish.
          regex_once(
              'src/stepnx/preview/commands.py',
              r'''    def note_opacity\(\n.*?\n\n\ndef parse_gameplay_command''',
              '''    def note_opacity(\n        self,\n        visibility: int,\n        *,\n        distance: float,\n        fade_distance: float,\n        time_ms: float,\n    ) -> float:\n        """Render serialized/COMMAND Appear and Vanish as continuous fades.\n\n        Header Visibility has already rewritten the event's low VisualEffect\n        bits before this function runs. Appear ramps from transparent to opaque\n        while approaching the receptor; Vanish performs the inverse ramp.\n        """\n\n        if self.nonstep or visibility == 0 or (self.vanish and self.appear):\n            return 0.0\n        span = max(1.0, float(fade_distance))\n        normalized = max(0.0, float(distance)) / span\n        if visibility == 1:  # Appear\n            opacity = 1.0 - normalized\n        elif visibility == 2:  # Vanish\n            opacity = normalized\n        else:\n            opacity = 1.0\n        if self.appear:\n            opacity = min(opacity, 1.0 - normalized)\n        if self.vanish:\n            opacity = min(opacity, normalized)\n        if self.flash and int(float(time_ms) // 100.0) % 2:\n            opacity = 0.0\n        return min(1.0, max(0.0, opacity))\n\n\ndef parse_gameplay_command''',
          )

          regex_once(
              'src/stepnx/gui/preview_widget.py',
              r'''    def _event_opacity\(self, event: PreviewEvent\) -> float:\n.*?\n\n    def visible_events''',
              '''    def _event_opacity(self, event: PreviewEvent) -> float:\n        _, local_y, _ = self._event_render_geometry(event)\n        _, sy, _, ty = self._sequence_affine()\n        screen_y = sy * local_y + ty\n        receptor_y = sy * self._receptor_y() + ty\n        return self.command.note_opacity(\n            int(event.visibility),\n            distance=abs(screen_y - receptor_y),\n            fade_distance=max(1.0, float(self.height()) * 0.42),\n            time_ms=self._chart_time_ms,\n        )\n\n    def visible_events''',
          )

          # Pure Snake regression: identity phase zero and continuity immediately
          # across the Div 222 boundary.
          replace_once(
              'tests/unit/test_rise_visual_modifiers.py',
              '''        lane = 2\n        self.assertEqual(\n            prime2_snake_path_lane_position(lane, 1.0, 5, 123, start=1.0, interval=2.0),\n            float(lane),\n        )\n        halfway = prime2_snake_path_lane_position(\n''',
              '''        lane = 2\n        self.assertEqual(frames[0], tuple(range(5)))\n        at_boundary = prime2_snake_path_lane_position(\n            lane, 1.0, 5, 123, start=1.0, interval=2.0\n        )\n        just_above = prime2_snake_path_lane_position(\n            lane, 1.000001, 5, 123, start=1.0, interval=2.0\n        )\n        self.assertEqual(at_boundary, float(lane))\n        self.assertAlmostEqual(just_above, float(lane), places=5)\n        halfway = prime2_snake_path_lane_position(\n''',
          )

          regex_once(
              'tests/unit/test_rise_visual_modifiers.py',
              r'''    def test_legacy_vanish_and_appear_switch_at_screen_midline\(self\) -> None:\n.*?\n\n\nclass SequenceZoneTransformTests''',
              '''    def test_legacy_vanish_and_appear_keep_continuous_fade(self) -> None:\n        vanish = parse_gameplay_command("v")\n        appear = parse_gameplay_command("p")\n        for distance, vanish_expected, appear_expected in (\n            (200.0, 1.0, 0.0),\n            (100.0, 0.5, 0.5),\n            (50.0, 0.25, 0.75),\n            (0.0, 0.0, 1.0),\n        ):\n            self.assertAlmostEqual(\n                vanish.note_opacity(\n                    3, distance=distance, fade_distance=200.0, time_ms=0.0\n                ),\n                vanish_expected,\n            )\n            self.assertAlmostEqual(\n                appear.note_opacity(\n                    3, distance=distance, fade_distance=200.0, time_ms=0.0\n                ),\n                appear_expected,\n            )\n\n\nclass SequenceZoneTransformTests''',
          )

          replace_once(
              'tests/unit/test_rise_visual_modifiers.py',
              '''            command.note_opacity(\n                3,\n                screen_y=300.0,\n                screen_midline=240.0,\n                time_ms=0.0,\n            ),\n''',
              '''            command.note_opacity(\n                3,\n                distance=100.0,\n                fade_distance=200.0,\n                time_ms=0.0,\n            ),\n''',
          )

          regex_once(
              'tests/unit/test_preview.py',
              r'''    def test_chart_visibility_composes_with_nonstep_vanish_and_flash\(self\) -> None:\n.*?\n\n    def test_launch_speed_overrides_legacy_cumulative_command_digits''',
              '''    def test_chart_visibility_composes_with_nonstep_vanish_and_flash(self) -> None:\n        plain = parse_gameplay_command("")\n        self.assertEqual(\n            plain.note_opacity(0, distance=100, fade_distance=200, time_ms=0),\n            0,\n        )\n        self.assertEqual(\n            plain.note_opacity(1, distance=50, fade_distance=200, time_ms=0),\n            0.75,\n        )\n        self.assertEqual(\n            plain.note_opacity(2, distance=50, fade_distance=200, time_ms=0),\n            0.25,\n        )\n        self.assertEqual(\n            parse_gameplay_command("n").note_opacity(\n                3, distance=100, fade_distance=200, time_ms=0\n            ),\n            0,\n        )\n        flashing = parse_gameplay_command("w")\n        self.assertEqual(\n            flashing.note_opacity(3, distance=100, fade_distance=200, time_ms=50),\n            1,\n        )\n        self.assertEqual(\n            flashing.note_opacity(3, distance=100, fade_distance=200, time_ms=150),\n            0,\n        )\n\n    def test_launch_speed_overrides_legacy_cumulative_command_digits''',
          )

          # Integration regression chooses a lane that the first generated phase
          # actually moves. Seeded permutations may leave any particular lane fixed.
          regex_once(
              'tests/unit/test_qt_preview.py',
              r'''    def test_visual_effect_snake_path_reads_block_221_222_without_header_snake\(self\) -> None:\n.*?\n        finally:\n            widget.close\(\)\n''',
              '''    def test_visual_effect_snake_path_reads_block_221_222_without_header_snake(self) -> None:\n        widget = self._widget()\n        try:\n            widget.resize(640, 480)\n            base = widget.stream.events[0]\n            widget.stream = replace(\n                widget.stream,\n                block_step_params=((\n                    base.block_id,\n                    (StepParam(221, 2), StepParam(222, 3)),\n                ),),\n            )\n            current_position = widget.stream.position_at(widget.chart_time_ms)\n            seed = widget.stream.route.seed or 0\n            candidates = [\n                (lane, prime2_snake_path_lane_position(\n                    lane, 4.0, widget.columns, seed, start=3.0, interval=2.0\n                ))\n                for lane in range(widget.columns)\n            ]\n            moving_lane, expected_lane = next(\n                (lane, position)\n                for lane, position in candidates\n                if abs(position - float(lane)) > 1e-9\n            )\n            plain = replace(\n                base,\n                lane=moving_lane,\n                raw=b"\\x03\\x03\\x00\\x00",\n                native_block_index=-1,\n                position=current_position + 4.0,\n            )\n            snake = replace(plain, raw=b"\\x03\\x13\\x00\\x00")\n\n            self.assertFalse(plain.snake_path)\n            self.assertTrue(snake.snake_path)\n            self.assertEqual(widget._event_x_offset(plain), 0.0)\n            expected = (\n                widget._lane_position_x(expected_lane)\n                - widget.lane_center(moving_lane)\n            )\n            self.assertNotEqual(expected, 0.0)\n            self.assertAlmostEqual(widget._event_x_offset(snake), expected)\n        finally:\n            widget.close()\n''',
          )

          # Remove the now-disproven midpoint-gate claim from the audit handoff.
          replace_once(
              'docs/RISE_RUNTIME_PARITY_HANDOFF.md',
              '''High bits, including `Effects.bZigZag = 0x10`, are preserved. StepNX performs the rewrite only on runtime event bytes, never on the canonical NX document. Appear/Vanish fade curves remain Animator/asset dependent, so the presentation is not claimed pixel-perfect.\n''',
              '''High bits, including `Effects.bZigZag = 0x10`, are preserved. StepNX performs the rewrite only on runtime event bytes, never on the canonical NX document. Legacy gameplay capture confirms that Appear/Vanish are continuous alpha fades rather than binary midpoint gates; StepNX restores the distance ramp while still treating the exact engine material/Animator curve as an approximation.\n''',
          )
          PY
      - name: Install Linux Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libopengl0 libpulse0 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0
      - name: Install StepNX Studio with GUI dependencies
        run: python -m pip install -e '.[gui]'
      - name: Run complete repository suite
        run: python -m unittest discover -s tests -v
      - name: Commit verified corrections
        run: |
          git config user.name 'OpenAI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-snake-continuity-visibility-fade.yml
          git rm .github/workflows/fix-snake-continuity-visibility-fade-v2.yml
          git add src/stepnx/preview/visuals.py \
                  src/stepnx/preview/commands.py \
                  src/stepnx/gui/preview_widget.py \
                  tests/unit/test_rise_visual_modifiers.py \
                  tests/unit/test_preview.py \
                  tests/unit/test_qt_preview.py \
                  docs/RISE_RUNTIME_PARITY_HANDOFF.md
          git diff --cached --check
          git commit -m 'Smooth Snake Path and restore visibility fades'
          git push origin HEAD:audit/rise-visual-command-re
