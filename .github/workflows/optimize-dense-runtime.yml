name: Optimize dense long-note runtime

on:
  push:
    branches:
      - audit/rise-visual-command-re

permissions:
  contents: write

jobs:
  optimize:
    if: github.event.head_commit.message == 'Run dense runtime optimization'
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/rise-visual-command-re
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply dense runtime optimization
        run: python .github/scripts/optimize-dense-runtime.py
      - name: Install Linux Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libopengl0 libpulse0 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0
      - name: Install StepNX Studio with GUI dependencies
        run: python -m pip install -e '.[gui]'
      - name: Run complete repository suite
        run: python -m unittest discover -s tests -v
      - name: Benchmark 3000 dense long ticks across 60 runtime frames
        run: |
          python - <<'PY'
          from dataclasses import replace
          from time import perf_counter
          from tests.unit.test_preview import RuntimeEventTests
          from stepnx.preview import GameplaySession, parse_gameplay_command

          stream = RuntimeEventTests._hold_stream()
          template = stream.events[1]
          events = tuple(
              replace(
                  template,
                  time_ms=index / 3.0,
                  beat=index / 384.0,
                  row_index=index,
                  lane=index % 5,
              )
              for index in range(3000)
          )
          stream = replace(stream, events=events)
          session = GameplaySession(stream, parse_gameplay_command(''), autoplay=True)
          costs = []
          for frame in range(1, 61):
              target = frame * (1000.0 / 60.0)
              started = perf_counter()
              session.advance(target)
              costs.append((perf_counter() - started) * 1000.0)
          print(
              'DENSE_RUNTIME_BENCH '
              f'events={len(events)} frames=60 '
              f'avg_ms={sum(costs)/len(costs):.4f} '
              f'max_ms={max(costs):.4f} '
              f'judgments={len(session.judgments)} '
              f'combo={session.stats.combo}'
          )
          PY
      - name: Commit verified runtime optimization
        run: |
          git config user.name 'OpenAI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/scripts/optimize-dense-runtime.py
          git rm .github/workflows/optimize-dense-runtime.yml
          git add src tests docs
          git diff --cached --check
          git commit -m 'Optimize dense long-note runtime'
          git push origin HEAD:audit/rise-visual-command-re
