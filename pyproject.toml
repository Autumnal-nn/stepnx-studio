[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stepnx-studio"
version = "0.1.0.dev0"
description = "Lossless NX20 chart core for StepNX Studio"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Autumnal" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
]
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.7,<7"]

[project.scripts]
stepnx = "stepnx.cli.main:main"
nxroundtrip = "stepnx.cli.roundtrip:main"
stepnx-studio = "stepnx.gui.app:main"
stepnx-viewport-benchmark = "stepnx.authoring.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stepnx = ["assets/BEAT.WAV", "assets/noteskin/**/*.png", "assets/ASSETS.md"]
